<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTV 工具箱</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1520;
      --bg-glow: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79, 209, 197, .22), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(56, 120, 180, .18), transparent 50%),
        linear-gradient(160deg, #0b1520 0%, #132433 48%, #0f1c28 100%);
      --panel: rgba(255, 255, 255, .08);
      --panel-border: rgba(255, 255, 255, .16);
      --text: #f3f7fa;
      --muted: #9db0c0;
      --accent: #4fd1c5;
      --accent-strong: #2bc4ad;
      --shadow: 0 18px 40px rgba(8, 18, 28, .45);
      --radius: 1.35rem;
      --max: min(1180px, 94vw);
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background: var(--bg-glow);
      background-color: var(--bg);
    }

    main {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: clamp(1.25rem, 3vh, 2.5rem) clamp(1rem, 2.5vw, 2rem) clamp(1.5rem, 3vh, 2.5rem);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    header {
      text-align: center;
      margin-bottom: clamp(1rem, 2.5vh, 1.75rem);
      flex-shrink: 0;
    }

    .brand {
      margin: 0;
      font-size: clamp(2.4rem, 5.5vw, 3.6rem);
      font-weight: 800;
      letter-spacing: .12em;
      line-height: 1.05;
    }

    .brand span {
      color: var(--accent)
    }

    .lead {
      margin: .55rem auto 0;
      max-width: 36rem;
      font-size: clamp(.95rem, 1.8vw, 1.15rem);
      color: var(--muted);
      line-height: 1.45;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .45rem;
      margin: 0 0 clamp(1rem, 2.2vh, 1.5rem);
      flex-shrink: 0;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .06);
      color: var(--muted);
      font: inherit;
      font-size: clamp(.85rem, 1.5vw, 1rem);
      font-weight: 800;
      letter-spacing: .04em;
      padding: .55rem 1rem;
      border-radius: .75rem;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s, transform .15s;
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: rgba(79, 209, 197, .45);
      background: rgba(79, 209, 197, .1);
    }

    .filter-btn.is-active {
      color: #06221e;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(43, 196, 173, .28);
    }

    .filter-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .launcher {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(.55rem, 1.2vw, .9rem);
      flex: 1;
      align-content: start;
    }

    .tool-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: clamp(7.4rem, 15vh, 9.8rem);
      padding: clamp(.7rem, 1.4vh, 1rem) .55rem;
      text-decoration: none;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
      overflow: hidden;
    }

    .tool-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--tile, var(--accent)) 35%, transparent), transparent 60%);
      opacity: .55;
      pointer-events: none;
    }

    .tool-tile:hover,
    .tool-tile:focus-visible {
      transform: translateY(-4px) scale(1.02);
      border-color: color-mix(in srgb, var(--tile, var(--accent)) 70%, white);
      box-shadow: 0 22px 48px rgba(8, 18, 28, .55);
      background: rgba(255, 255, 255, .12);
      outline: none;
    }

    .tool-tile.is-hidden {
      display: none
    }

    .tool-icon {
      position: relative;
      z-index: 1;
      width: clamp(2.9rem, 5.5vw, 3.9rem);
      height: clamp(2.9rem, 5.5vw, 3.9rem);
      border-radius: 1rem;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--tile, var(--accent)) 22%, rgba(8, 18, 28, .65));
      border: 1px solid color-mix(in srgb, var(--tile, var(--accent)) 45%, transparent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .tool-icon svg {
      width: 58%;
      height: 58%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: #e8fbff;
    }

    .tool-name {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      font-weight: 800;
      letter-spacing: .03em;
      text-align: center;
      line-height: 1.15;
      white-space: nowrap;
    }

    .tool-tip {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(.68rem, 1.05vw, .8rem);
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      line-height: 1.25;
      max-width: 9.5rem;
    }

    .empty-hint {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      padding: 2rem;
    }

    .launcher.is-empty .empty-hint {
      display: block
    }

    footer {
      margin-top: clamp(1.25rem, 3vh, 2rem);
      text-align: center;
      flex-shrink: 0;
    }

    .badge {
      display: inline-block;
      font-size: .75rem;
      padding: .28rem .65rem;
      border: 1px solid rgba(148, 163, 184, .35);
      border-radius: 999px;
      color: var(--muted);
      letter-spacing: .02em;
    }

    @media (max-width: 1199px) {
      .launcher {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }
    }

    @media (max-width: 959px) {
      .launcher {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }
    }

    @media (max-width: 679px) {
      .launcher {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .tool-tile {
        min-height: 7.2rem
      }

      .tool-name {
        white-space: normal
      }
    }

    @media (max-width: 379px) {
      .launcher {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1 class="brand">Edu<span>TV</span></h1>
      <p class="lead">教室大螢幕工具箱 · 點圖示即可開啟</p>
    </header>

    <div class="filters" role="tablist" aria-label="工具分類">
      <button type="button" class="filter-btn is-active" data-filter="all" role="tab" aria-selected="true">全部</button>
      <button type="button" class="filter-btn" data-filter="board" role="tab" aria-selected="false">揭示</button>
      <button type="button" class="filter-btn" data-filter="tempo" role="tab" aria-selected="false">節奏</button>
      <button type="button" class="filter-btn" data-filter="interact" role="tab" aria-selected="false">互動</button>
      <button type="button" class="filter-btn" data-filter="mood" role="tab" aria-selected="false">氛圍</button>
    </div>

    <section class="launcher" id="launcher" aria-label="工具啟動器">
      <a class="tool-tile" data-cat="board" href="examInfoOnTv.html" target="_blank" rel="noopener"

        <p class="tool-tip">時程 · 缺考 · 公告</p>
      </a>

        <span class="tool-icon" aria-hidden="true">

          </svg>
        </span>
        <h2 class="tool-name">單純時鐘</h2>
        <p class="tool-tip">現在時間 · 到秒 · 多種樣式</p>
      </a>

      <a class="tool-tile" data-cat="interact" href="whiteBoard.html" target="_blank" rel="noopener"

        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">

          </svg>
        </span>

        <p class="tool-tip">繪圖與註記</p>
      </a>

      <a class="tool-tile" data-cat="tempo" href="SlowJoggingMetronome.html" target="_blank" rel="noopener"
        style="--tile:#34d399" title="慢跑節拍與呼吸節奏">
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 8v4l3 2" />
          </svg>
        </span>
        <h2 class="tool-name">慢跑節拍</h2>
        <p class="tool-tip">穩定步伐提示</p>

      <a class="tool-tile" data-cat="tempo" href="superMetronome.html" target="_blank" rel="noopener"

        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v18M8 8l8 8M16 8l-8 8" />

          </svg>
        </span>
        <h2 class="tool-name">進階節拍</h2>
        <p class="tool-tip">多音色節奏</p>
      </a>

      <a class="tool-tile" data-cat="tempo" href="PomodoroTimer.html" target="_blank" rel="noopener"

        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">

            <path d="M12 9v4l2.5 1.5M9 4c1 .8 2 1.2 3 1.2S14 4.8 15 4" />

        </span>
        <h2 class="tool-name">番茄鐘</h2>
        <p class="tool-tip">專注與休息</p>
      </a>

      <a class="tool-tile" data-cat="interact" href="random-picker/index.html" target="_blank" rel="noopener"

        <span class="tool-icon" aria-hidden="true">

            <path d="M14 7h3v3M10 17H7v-3" />
          </svg>

        <h2 class="tool-name">籤筒</h2>
        <p class="tool-tip">隨機抽出學生</p>
      </a>

      <a class="tool-tile" data-cat="tempo" href="classCountdownQueue.html" target="_blank" rel="noopener"

          <svg viewBox="0 0 24 24">
            <circle cx="8" cy="9" r="2.5" />

          </svg>
        </span>
        <h2 class="tool-name">分組</h2>
        <p class="tool-tip">分組與任務</p>
      </a>

      <a class="tool-tile" data-cat="board" href="progressWall.html" target="_blank" rel="noopener"
        style="--tile:#60a5fa" title="學習進度牆">
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">

        <p class="tool-tip">進度與徽章</p>
      </a>

      <a class="tool-tile" data-cat="interact" href="classScoreboard.html" target="_blank" rel="noopener"

        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 20V10M12 20V4M16 20v-6" />
            <path d="M5 20h14" />
          </svg>
        </span>
        <h2 class="tool-name">記分板</h2>
        <p class="tool-tip">即時加扣分</p>
      </a>

      <a class="tool-tile" data-cat="interact" href="interactivePoll.html" target="_blank" rel="noopener"
        style="--tile:#22d3ee" title="互動問答與投票">
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19V9h4v10H5zM10 19v-6h4v6h-4zM15 19V5h4v14h-4z" />
          </svg>
        </span>
        <h2 class="tool-name">問答牆</h2>
        <p class="tool-tip">投票與簡答</p>
      </a>

      <a class="tool-tile" data-cat="mood" href="classroomAtmosphere.html" target="_blank" rel="noopener"
        style="--tile:#818cf8" title="教室氛圍與背景音樂">
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M9 18V6l10-2v12" />
            <circle cx="7" cy="18" r="2.5" />
            <circle cx="17" cy="16" r="2.5" />
          </svg>
        </span>
        <h2 class="tool-name">氛圍</h2>
        <p class="tool-tip">音樂與場景</p>
      </a>

      <a class="tool-tile" data-cat="board" href="volumeAgreement.html" target="_blank" rel="noopener"
        style="--tile:#4ade80" title="音量約定與提醒">
        <span class="tool-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 10v4h3l4 4V6L7 10H4zM16 9a4 4 0 0 1 0 6M18.5 7a7 7 0 0 1 0 10" />
          </svg>
        </span>

        <p class="tool-tip">約定與提醒</p>
      </a>

      <p class="empty-hint">此分類尚無工具</p>
    </section>

    <footer>
      <span class="badge">Developed by DennisZ</span>
    </footer>
  </main>

  <script>
    (function () {
      const launcher = document.getElementById('launcher');
      const tiles = [...launcher.querySelectorAll('.tool-tile')];
      const buttons = [...document.querySelectorAll('.filter-btn')];

      function applyFilter(cat) {
        let visible = 0;
        tiles.forEach((tile) => {
          const show = cat === 'all' || tile.dataset.cat === cat;
          tile.classList.toggle('is-hidden', !show);
          if (show) visible += 1;
        });
        launcher.classList.toggle('is-empty', visible === 0);
        buttons.forEach((btn) => {
          const active = btn.dataset.filter === cat;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-selected', active ? 'true' : 'false');
        });
      }

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => applyFilter(btn.dataset.filter || 'all'));
      });
    })();
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班級即時記分板 | EduTV Tools</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #070b14;
      --bg-2: #0f172a;
      --bg-3: #172554;
      --panel: rgba(255, 255, 255, 0.07);
      --panel-border: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --success: #4ade80;
      --danger: #fb7185;
      --gold: #fbbf24;
      --tie: #c4b5fd;
      --shadow: 0 20px 44px rgba(0, 0, 0, 0.5);
      /* 高對比組色：深底＋亮邊，文字永遠用白 */
      --team-1: #ff4d4f;
      --team-2: #3b82f6;
      --team-3: #22c55e;
      --team-4: #f59e0b;
      --team-5: #a855f7;
      --team-6: #06b6d4;
      --team-7: #ec4899;
      --team-8: #84cc16;
      --card-bg: #111827;
      --ink: #ffffff;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 8%, rgba(56, 189, 248, 0.14), transparent 40%),
        radial-gradient(circle at 90% 12%, rgba(251, 191, 36, 0.1), transparent 36%),
        linear-gradient(155deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: clamp(0.55rem, 1.3vh, 1rem) clamp(0.7rem, 1.5vw, 1.25rem);
      gap: clamp(0.45rem, 1.1vh, 0.85rem);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 2.55rem;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      font-size: clamp(0.92rem, 1.7vh, 1.1rem);
      color: var(--muted);
    }

    .pill strong {
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .timer-pill {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.25rem, 3.2vh, 1.95rem);
      font-weight: 800;
      color: var(--ink);
      min-width: 7.8rem;
      justify-content: center;
    }

    .timer-pill.is-low {
      color: #fee2e2;
      border-color: rgba(248, 113, 113, 0.65);
      background: rgba(127, 29, 29, 0.55);
    }

    .timer-pill.is-off {
      opacity: 0.4;
    }

    .mode-pill[data-mode="live"] strong {
      color: #86efac;
    }

    .mode-pill[data-mode="locked"] strong {
      color: #fde68a;
    }

    .mode-pill[data-mode="setup"] strong {
      color: #7dd3fc;
    }

    .hint-pill {
      color: #e2e8f0;
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(14, 165, 233, 0.12);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 2.75rem;
      padding: 0.4rem 0.85rem;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--ink);
      transition: background 160ms ease, border-color 160ms ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.6);
      outline: none;
    }

    .icon-btn.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: rgba(56, 189, 248, 0.75);
    }

    .icon-btn svg {
      width: 1.3rem;
      height: 1.3rem;
    }

    .fs-toggle .fs-exit {
      display: none;
    }

    .fs-toggle.active .fs-expand {
      display: none;
    }

    .fs-toggle.active .fs-exit {
      display: block;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.3rem;
      padding: 0.08rem 0.32rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.76rem;
      color: #cbd5e1;
    }

    .locked-banner {
      display: none;
      justify-self: center;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(120, 53, 15, 0.7);
      border: 1px solid rgba(251, 191, 36, 0.65);
      color: #fef3c7;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: clamp(0.9rem, 1.8vh, 1.1rem);
    }

    body.is-locked .locked-banner {
      display: inline-flex;
    }

    .board {
      min-height: 0;
      display: grid;
      gap: clamp(0.5rem, 1.1vh, 0.9rem);
      align-content: stretch;
    }

    .board[data-count="2"] {
      grid-template-columns: repeat(2, 1fr);
    }

    .board[data-count="3"] {
      grid-template-columns: repeat(3, 1fr);
    }

    .board[data-count="4"] {
      grid-template-columns: repeat(2, 1fr);
    }

    .board[data-count="5"],
    .board[data-count="6"] {
      grid-template-columns: repeat(3, 1fr);
    }

    .board[data-count="7"],
    .board[data-count="8"] {
      grid-template-columns: repeat(4, 1fr);
    }

    .team-card {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.3rem;
      min-height: 0;
      padding: clamp(0.55rem, 1.4vh, 1rem);
      border-radius: 20px;
      background: var(--card-bg);
      border: 3px solid var(--team-color);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 140ms ease, box-shadow 140ms ease, border-width 140ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      color: var(--ink);
    }

    .team-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 0.55rem;
      background: var(--team-color);
    }

    .team-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg,
          color-mix(in srgb, var(--team-color) 18%, transparent),
          transparent 48%);
      pointer-events: none;
    }

    .team-card>* {
      position: relative;
      z-index: 1;
    }

    .team-card.is-selected {
      transform: translateY(-2px);
      box-shadow:
        0 0 0 3px #f8fafc,
        0 0 0 6px color-mix(in srgb, var(--team-color) 70%, white),
        var(--shadow);
    }

    .team-card.is-leader {
      border-color: var(--gold);
      box-shadow:
        0 0 0 3px rgba(251, 191, 36, 0.75),
        0 16px 36px rgba(251, 191, 36, 0.22),
        var(--shadow);
    }

    .team-card.is-tie {
      border-color: var(--tie);
      box-shadow:
        0 0 0 3px rgba(196, 181, 253, 0.65),
        0 16px 36px rgba(167, 139, 250, 0.18),
        var(--shadow);
    }

    .team-card.is-flash-plus {
      animation: flashPlus 420ms ease;
    }

    .team-card.is-flash-minus {
      animation: flashMinus 420ms ease;
    }

    @keyframes flashPlus {
      0% {
        background: #14532d;
      }

      100% {
        background: var(--card-bg);
      }
    }

    @keyframes flashMinus {
      0% {
        background: #7f1d1d;
      }

      100% {
        background: var(--card-bg);
      }
    }

    .team-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.4rem;
      padding-left: 0.35rem;
    }

    .team-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
    }

    .team-index {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.85rem;
      height: 1.85rem;
      border-radius: 999px;
      background: #000;
      border: 2px solid var(--team-color);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 900;
    }

    .team-name {
      margin: 0;
      font-size: clamp(1.05rem, 2.3vh, 1.75rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
      word-break: break-word;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .team-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .badge {
      display: none;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      font-size: clamp(0.72rem, 1.4vh, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .team-card.is-leader .badge-lead,
    .team-card.is-tie .badge-tie {
      display: inline-flex;
    }

    .badge-lead {
      background: #78350f;
      color: #fef3c7;
      border: 1px solid #fbbf24;
    }

    .badge-tie {
      background: #4c1d95;
      color: #ede9fe;
      border: 1px solid #c4b5fd;
    }

    .round-score {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3.2rem, 14vh, 8.5rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow:
        0 2px 0 rgba(0, 0, 0, 0.35),
        0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .board[data-count="7"] .round-score,
    .board[data-count="8"] .round-score {
      font-size: clamp(2.6rem, 11vh, 6.2rem);
    }

    .total-score {
      text-align: center;
      font-size: clamp(0.9rem, 1.9vh, 1.15rem);
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .total-score strong {
      color: #fff;
      font-size: 1.15em;
    }

    .score-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.2rem;
      padding-left: 0.2rem;
    }

    .score-btn {
      min-height: 3.5rem;
      border-radius: 14px;
      font-size: clamp(1.55rem, 3.2vh, 2.25rem);
      font-weight: 900;
      border: 2px solid transparent;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .score-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .score-btn.plus {
      background: #166534;
      border-color: #4ade80;
      color: #dcfce7;
    }

    .score-btn.minus {
      background: #9f1239;
      border-color: #fb7185;
      color: #ffe4e6;
    }

    .score-btn:disabled,
    body.is-locked .score-btn {
      opacity: 0.32;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }

    .toolbar .btn {
      display: none;
    }

    body.is-setup .toolbar .btn-when-setup {
      display: inline-flex;
    }

    body.is-live .toolbar .btn-when-live {
      display: inline-flex;
    }

    body.is-locked .toolbar .btn-when-locked {
      display: inline-flex;
    }

    body.is-live.has-timer .toolbar .btn-when-timer {
      display: inline-flex;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 3.15rem;
      padding: 0.55rem 1.15rem;
      border-radius: 16px;
      font-size: clamp(1rem, 2vh, 1.2rem);
      font-weight: 800;
      border: 1px solid transparent;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #041018;
      min-width: 9rem;
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.22);
      color: #f8fafc;
    }

    .btn-warning {
      background: #92400e;
      border-color: #fbbf24;
      color: #fef3c7;
      min-width: 8rem;
    }

    .btn-danger {
      background: #9f1239;
      border-color: #fb7185;
      color: #ffe4e6;
    }

    .btn-hero {
      min-height: 3.5rem;
      font-size: clamp(1.1rem, 2.3vh, 1.35rem);
      padding: 0.65rem 1.5rem;
    }

    .setup-drawer {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 0.85rem;
      background: rgba(2, 6, 23, 0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .setup-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .setup-panel {
      width: min(980px, 100%);
      max-height: min(94dvh, 920px);
      overflow: auto;
      padding: clamp(1rem, 2.2vh, 1.55rem);
      border-radius: 24px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow);
      color: #f8fafc;
    }

    .setup-panel h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.45rem, 2.8vh, 1.9rem);
      letter-spacing: 0.06em;
      color: #fff;
    }

    .setup-lead {
      margin: 0 0 1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .setup-steps {
      display: grid;
      gap: 1rem;
    }

    .step {
      padding: 0.9rem 1rem;
      border-radius: 18px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .step-label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.7rem;
      font-weight: 800;
      color: #fff;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 999px;
      background: #0284c7;
      color: #fff;
      font-size: 0.95rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .chip {
      min-height: 2.9rem;
      min-width: 3.2rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .chip:hover,
    .chip:focus-visible {
      border-color: #38bdf8;
      outline: none;
    }

    .chip.is-active {
      background: #0369a1;
      border-color: #7dd3fc;
      color: #fff;
    }

    .chip.is-off.is-active {
      background: #334155;
      border-color: #94a3b8;
    }

    .team-names {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.55rem;
    }

    .team-name-row {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 0.5rem;
      align-items: center;
    }

    .swatch {
      width: 2rem;
      height: 2.55rem;
      border-radius: 10px;
      background: var(--team-color);
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
    }

    .team-name-row input {
      min-height: 2.7rem;
      padding: 0.4rem 0.7rem;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .team-name-row input:focus {
      outline: 2px solid rgba(56, 189, 248, 0.65);
      outline-offset: 1px;
    }

    .custom-time {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.65rem;
    }

    .custom-time.open {
      display: grid;
    }

    .custom-time label {
      display: grid;
      gap: 0.3rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .custom-time input {
      min-height: 2.7rem;
      padding: 0.4rem 0.7rem;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .setup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .name-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
    }

    .name-tools .chip {
      min-height: 2.4rem;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .hotkey-help {
      margin-top: 0.9rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .hotkey-help code {
      display: inline-block;
      padding: 0.05rem 0.32rem;
      border-radius: 6px;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      font-size: 0.85em;
    }

    .toast-area {
      position: fixed;
      left: 50%;
      bottom: 5.4rem;
      transform: translateX(-50%);
      z-index: 50;
      display: grid;
      gap: 0.4rem;
      pointer-events: none;
    }

    .toast {
      padding: 0.7rem 1.1rem;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #fff;
      box-shadow: var(--shadow);
      font-weight: 800;
      animation: toastIn 180ms ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1100px) {

      .board[data-count="7"],
      .board[data-count="8"] {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 900px) {

      .board[data-count="3"],
      .board[data-count="5"],
      .board[data-count="6"] {
        grid-template-columns: repeat(2, 1fr);
      }

      .board[data-count="7"],
      .board[data-count="8"] {
        grid-template-columns: repeat(2, 1fr);
      }

      .round-score {
        font-size: clamp(2.8rem, 11vh, 5.5rem);
      }
    }

    @media (max-height: 700px) {
      .score-btn {
        min-height: 3rem;
      }

      .round-score {
        font-size: clamp(2.4rem, 12vh, 5.8rem);
      }
    }
  </style>
</head>

<body class="is-setup">
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="pill mode-pill" id="mode-pill" data-mode="setup">
          狀態 <strong id="mode-label">設定</strong>
        </div>
        <div class="pill">第 <strong id="round-label">1</strong> 輪</div>
        <div class="pill timer-pill is-off" id="timer-pill" aria-live="polite">--:--</div>
        <div class="pill hint-pill" id="hint-pill">點組牌上的 ＋／− 直接加減</div>
      </div>
      <div class="topbar-right">
        <button type="button" class="icon-btn active" id="btn-sound" title="音效與語音 (M)" aria-pressed="true">
          <span id="sound-label">音效開</span>
          <span class="kbd">M</span>
        </button>
        <button type="button" class="icon-btn" id="btn-setup" title="設定 (S)">
          <span>設定</span>
          <span class="kbd">S</span>
        </button>
        <button type="button" class="icon-btn fs-toggle" id="fullscreen-toggle-btn" title="全螢幕 (F)"
          aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <g class="fs-expand">
              <path d="M4.6 9.1V5.4a.8.8 0 0 1 .8-.8h3.7" />
              <path d="M14.9 4.6h3.7a.8.8 0 0 1 .8.8v3.7" />
              <path d="M19.4 14.9v3.7a.8.8 0 0 1-.8.8h-3.7" />
              <path d="M9.1 19.4H5.4a.8.8 0 0 1-.8-.8v-3.7" />
            </g>
            <g class="fs-exit">
              <path d="M9.2 4.6v3.2a.8.8 0 0 1-.8.8H5.2" />
              <path d="M14.8 4.6v3.2a.8.8 0 0 0 .8.8h3.2" />
              <path d="M19.4 14.8h-3.2a.8.8 0 0 0-.8.8v3.2" />
              <path d="M9.2 19.4v-3.2a.8.8 0 0 0-.8-.8H5.2" />
            </g>
          </svg>
          <span id="fullscreen-label">全螢幕</span>
          <span class="kbd">F</span>
        </button>
      </div>
    </header>

    <div class="locked-banner" id="locked-banner">本輪結束 · 分數已鎖定 · 按「下一輪」繼續</div>
    <main class="board" id="board" data-count="4" aria-label="記分板"></main>

    <footer class="toolbar">
      <button type="button" class="btn btn-primary btn-hero btn-when-setup" id="btn-start-round">開始本輪</button>
      <button type="button" class="btn btn-secondary btn-when-timer" id="btn-toggle-timer">
        <span id="timer-toggle-label">暫停倒數</span>
        <span class="kbd">空白</span>
      </button>
      <button type="button" class="btn btn-warning btn-hero btn-when-live" id="btn-lock">
        <span>鎖分結束本輪</span>
        <span class="kbd">L</span>
      </button>
      <button type="button" class="btn btn-primary btn-hero btn-when-locked" id="btn-next-round">
        <span>下一輪</span>
        <span class="kbd">N</span>
      </button>
      <button type="button" class="btn btn-secondary btn-when-locked" id="btn-reset-round">
        <span>本輪歸零</span>
        <span class="kbd">R</span>
      </button>
      <button type="button" class="btn btn-secondary btn-when-setup" id="btn-open-setup-again">調整設定</button>
    </footer>
  </div>

  <div class="setup-drawer" id="setup-drawer" aria-hidden="true">
    <div class="setup-panel" role="dialog" aria-labelledby="setup-title">
      <h1 id="setup-title">班級即時記分板</h1>
      <p class="setup-lead">三步就好：選組數 → 選時間 → 開始。課堂上直接點各組 ＋／−，不必先選組。</p>

      <div class="setup-steps">
        <section class="step">
          <div class="step-label"><span class="step-num">1</span> 幾組比賽？</div>
          <div class="chip-row" id="team-count-chips" role="group" aria-label="組數"></div>
        </section>

        <section class="step">
          <div class="step-label"><span class="step-num">2</span> 組名（可改）</div>
          <div class="name-tools">
            <button type="button" class="chip" id="btn-names-number">用「第N組」</button>
            <button type="button" class="chip" id="btn-names-color">用顏色當組名</button>
          </div>
          <div class="team-names" id="team-names"></div>
        </section>

        <section class="step">
          <div class="step-label"><span class="step-num">3</span> 本輪時間</div>
          <div class="chip-row" id="timer-chips" role="group" aria-label="倒數時間"></div>
          <div class="custom-time" id="custom-time">
            <label>
              分鐘
              <input type="number" id="timer-minutes" min="0" max="99" value="3" inputmode="numeric" />
            </label>
            <label>
              秒
              <input type="number" id="timer-seconds" min="0" max="59" value="0" inputmode="numeric" />
            </label>
          </div>
        </section>
      </div>

      <div class="setup-actions">
        <button type="button" class="btn btn-primary btn-hero" id="btn-apply-start">開始記分</button>
        <button type="button" class="btn btn-secondary" id="btn-close-setup">先關閉</button>
        <button type="button" class="btn btn-danger" id="btn-reset-totals">重設總分</button>
      </div>

      <div class="hotkey-help">
        <div>觸控：直接點各組 <code>＋</code> / <code>−</code> · 鍵盤：<code>1</code>–<code>8</code> 選組 ·
          <code>+</code>/<code>-</code> 加減</div>
        <div>加分有歡呼語音、扣分有加油語音 · <code>M</code> 開關音效 · <code>空白</code> 倒數 · <code>L</code> 鎖分 · <code>N</code> 下一輪 ·
          <code>S</code> 設定 · <code>F</code> 全螢幕</div>
      </div>
    </div>
  </div>

  <div class="toast-area" id="toast-area" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'edutv-class-scoreboard-v2';
      const MAX_TEAMS = 8;
      const TEAM_COLORS = [
        'var(--team-1)', 'var(--team-2)', 'var(--team-3)', 'var(--team-4)',
        'var(--team-5)', 'var(--team-6)', 'var(--team-7)', 'var(--team-8)',
      ];
      const COLOR_NAMES = ['紅組', '藍組', '綠組', '橙組', '紫組', '青組', '粉組', '萊姆組'];
      const MODE_LABELS = { setup: '設定', live: '進行中', locked: '已鎖分' };
      const TIMER_PRESETS = [
        { id: 'off', label: '無倒數', sec: 0, enabled: false },
        { id: '60', label: '1 分', sec: 60, enabled: true },
        { id: '120', label: '2 分', sec: 120, enabled: true },
        { id: '180', label: '3 分', sec: 180, enabled: true },
        { id: '300', label: '5 分', sec: 300, enabled: true },
        { id: '600', label: '10 分', sec: 600, enabled: true },
        { id: 'custom', label: '自訂', sec: null, enabled: true },
      ];

      const boardEl = document.getElementById('board');
      const modePill = document.getElementById('mode-pill');
      const modeLabel = document.getElementById('mode-label');
      const roundLabel = document.getElementById('round-label');
      const timerPill = document.getElementById('timer-pill');
      const hintPill = document.getElementById('hint-pill');
      const setupDrawer = document.getElementById('setup-drawer');
      const teamCountChips = document.getElementById('team-count-chips');
      const timerChips = document.getElementById('timer-chips');
      const customTimeEl = document.getElementById('custom-time');
      const teamNamesEl = document.getElementById('team-names');
      const timerMinutesEl = document.getElementById('timer-minutes');
      const timerSecondsEl = document.getElementById('timer-seconds');
      const fullscreenBtn = document.getElementById('fullscreen-toggle-btn');
      const fullscreenLabel = document.getElementById('fullscreen-label');
      const toastArea = document.getElementById('toast-area');
      const btnSetup = document.getElementById('btn-setup');
      const btnSound = document.getElementById('btn-sound');
      const soundLabel = document.getElementById('sound-label');
      const btnStartRound = document.getElementById('btn-start-round');
      const btnToggleTimer = document.getElementById('btn-toggle-timer');
      const timerToggleLabel = document.getElementById('timer-toggle-label');
      const btnLock = document.getElementById('btn-lock');
      const btnNextRound = document.getElementById('btn-next-round');
      const btnResetRound = document.getElementById('btn-reset-round');
      const btnApplyStart = document.getElementById('btn-apply-start');
      const btnCloseSetup = document.getElementById('btn-close-setup');
      const btnResetTotals = document.getElementById('btn-reset-totals');
      const btnOpenSetupAgain = document.getElementById('btn-open-setup-again');
      const btnNamesNumber = document.getElementById('btn-names-number');
      const btnNamesColor = document.getElementById('btn-names-color');

      let audioContext = null;
      let timerRaf = null;
      let lastTickAt = 0;
      let builtCount = 0;
      let setupOpen = false;
      let draftCount = 4;
      let draftTimerId = '180';
      let soundEnabled = true;
      let cheerPhraseIndex = 0;
      let zhVoice = null;

      const CHEER_PHRASES = [
        (name) => `恭喜${name}！太棒了！`,
        (name) => `${name}加分！繼續加油！`,
        (name) => `哇賽！${name}得分囉！`,
        (name) => `厲害！為${name}鼓掌！`,
        (name) => `${name}表現超優！`,
      ];

      function makeTeam(i, name) {
        return {
          id: `t${i + 1}`,
          name: name || `第${i + 1}組`,
          color: TEAM_COLORS[i],
          roundScore: 0,
          totalScore: 0,
        };
      }

      function createSession() {
        const teams = Array.from({ length: MAX_TEAMS }, (_, i) => makeTeam(i));
        return {
          teamCount: 4,
          teams,
          mode: 'setup',
          selectedTeamId: teams[0].id,
          timer: {
            enabled: true,
            durationSec: 180,
            remainingMs: 180000,
            running: false,
            presetId: '180',
          },
          roundIndex: 1,
          updatedAt: new Date().toISOString(),
        };
      }

      let session = createSession();

      function activeTeams() {
        return session.teams.slice(0, session.teamCount);
      }

      function findTeam(id) {
        return session.teams.find((t) => t.id === id) || null;
      }

      function clampCount(n) {
        return Math.min(MAX_TEAMS, Math.max(2, Number(n) || 4));
      }

      function formatTime(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function showToast(text) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = text;
        toastArea.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }

      function initAudioContext() {
        if (!audioContext) {
          try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
          } catch (_) {
            audioContext = null;
          }
        }
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume().catch(() => { });
        }
      }

      function tone(freq, start, dur, type, peak) {
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak || 0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
        return osc;
      }

      function playLockChime() {
        if (!soundEnabled) return;
        initAudioContext();
        if (!audioContext) return;
        const t0 = audioContext.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          tone(freq, t0 + i * 0.12, 0.35, 'sine', 0.22);
        });
      }

      function playCheerSound() {
        if (!soundEnabled) return;
        initAudioContext();
        if (!audioContext) return;
        const t0 = audioContext.currentTime;
        // 上行大調琶音 + 高八度叮
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          tone(freq, t0 + i * 0.08, 0.28, i === 3 ? 'triangle' : 'sine', i === 3 ? 0.28 : 0.18);
        });
        tone(1318.5, t0 + 0.36, 0.22, 'triangle', 0.16);
      }

      function playJeerSound() {
        if (!soundEnabled) return;
        initAudioContext();
        if (!audioContext) return;
        const t0 = audioContext.currentTime;
        // 往下滑的「唉唷」感 + 低沉嗡聲
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, t0);
        osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.55);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(t0);
        osc.stop(t0 + 0.65);
        tone(180, t0 + 0.08, 0.35, 'square', 0.06);
        tone(140, t0 + 0.28, 0.4, 'triangle', 0.08);
      }

      function pickZhVoice() {
        if (!window.speechSynthesis) return null;
        const voices = window.speechSynthesis.getVoices();
        zhVoice =
          voices.find((v) => v.lang === 'zh-TW') ||
          voices.find((v) => v.lang === 'zh-HK') ||
          voices.find((v) => v.lang === 'zh-CN') ||
          voices.find((v) => /^zh/i.test(v.lang)) ||
          null;
        return zhVoice;
      }

      if (window.speechSynthesis) {
        pickZhVoice();
        window.speechSynthesis.onvoiceschanged = pickZhVoice;
      }

      function speakText(text, { rate = 1.05, pitch = 1.1 } = {}) {
        if (!soundEnabled || !text || !window.speechSynthesis) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          const voice = zhVoice || pickZhVoice();
          if (voice) u.voice = voice;
          u.lang = voice?.lang || 'zh-TW';
          u.rate = rate;
          u.pitch = pitch;
          u.volume = 1;
          window.speechSynthesis.speak(u);
        } catch (_) { }
      }

      function teamNumber(team) {
        const idx = session.teams.findIndex((t) => t.id === team.id);
        return idx >= 0 ? idx + 1 : 1;
      }

      function announceScore(team, delta) {
        if (delta > 0) {
          playCheerSound();
          const phrase = CHEER_PHRASES[cheerPhraseIndex % CHEER_PHRASES.length](team.name);
          cheerPhraseIndex += 1;
          speakText(phrase, { rate: 1.08, pitch: 1.2 });
        } else {
          playJeerSound();
          speakText(`第${teamNumber(team)}組你怎麼被扣分，要加油喔`, { rate: 1.0, pitch: 0.85 });
        }
      }

      function setSoundEnabled(on) {
        soundEnabled = !!on;
        btnSound.classList.toggle('active', soundEnabled);
        btnSound.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
        soundLabel.textContent = soundEnabled ? '音效開' : '音效關';
        try {
          localStorage.setItem('edutv-scoreboard-sound', soundEnabled ? '1' : '0');
        } catch (_) { }
        if (!soundEnabled && window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      }

      function toggleSound() {
        setSoundEnabled(!soundEnabled);
        showToast(soundEnabled ? '音效與語音已開啟' : '音效與語音已關閉');
      }

      function persist() {
        session.updatedAt = new Date().toISOString();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        } catch (_) { }
      }

      function restore() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) raw = localStorage.getItem('edutv-class-scoreboard-v1');
          if (!raw) return;
          const data = JSON.parse(raw);
          if (!data || !Array.isArray(data.teams)) return;
          const next = createSession();
          next.teamCount = clampCount(data.teamCount);
          next.mode = ['setup', 'live', 'locked'].includes(data.mode) ? data.mode : 'setup';
          next.roundIndex = Math.max(1, Number(data.roundIndex) || 1);
          next.selectedTeamId = data.selectedTeamId || next.teams[0].id;
          next.timer = {
            enabled: data.timer?.enabled !== false,
            durationSec: Math.max(0, Number(data.timer?.durationSec) || 180),
            remainingMs: Math.max(0, Number(data.timer?.remainingMs) || 0),
            running: false,
            presetId: data.timer?.presetId || guessPresetId(data.timer),
          };
          for (let i = 0; i < MAX_TEAMS; i++) {
            const src = data.teams[i] || {};
            next.teams[i] = {
              id: `t${i + 1}`,
              name: typeof src.name === 'string' && src.name.trim() ? src.name.trim() : `第${i + 1}組`,
              color: TEAM_COLORS[i],
              roundScore: Number.isFinite(src.roundScore) ? src.roundScore : 0,
              totalScore: Number.isFinite(src.totalScore) ? src.totalScore : 0,
            };
          }
          if (!next.teams.slice(0, next.teamCount).some((t) => t.id === next.selectedTeamId)) {
            next.selectedTeamId = next.teams[0].id;
          }
          session = next;
        } catch (_) { }
      }

      function guessPresetId(timer) {
        if (!timer || timer.enabled === false) return 'off';
        const sec = Number(timer.durationSec) || 0;
        const hit = TIMER_PRESETS.find((p) => p.enabled && p.sec === sec);
        return hit ? hit.id : 'custom';
      }

      function rankInfo() {
        const teams = activeTeams();
        const scores = teams.map((t) => t.roundScore);
        const max = Math.max(...scores);
        const leaders = teams.filter((t) => t.roundScore === max);
        const allZero = teams.every((t) => t.roundScore === 0);
        const isTie = leaders.length > 1 && !allZero;
        const hasLead = !allZero;
        return { isTie, hasLead, leaderIds: new Set(leaders.map((t) => t.id)) };
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function rebuildBoard() {
        const teams = activeTeams();
        boardEl.dataset.count = String(session.teamCount);
        boardEl.innerHTML = teams.map((team, index) => `
          <article class="team-card" data-team-id="${team.id}" style="--team-color: ${team.color}" tabindex="0" role="group" aria-label="${escapeHtml(team.name)}">
            <div class="team-head">
              <div class="team-title">
                <span class="team-index" aria-hidden="true">${index + 1}</span>
                <h2 class="team-name">${escapeHtml(team.name)}</h2>
              </div>
              <div class="team-badges">
                <span class="badge badge-lead">第一名</span>
                <span class="badge badge-tie">平手</span>
              </div>
            </div>
            <div class="round-score" data-round>${team.roundScore}</div>
            <div class="total-score">總分 <strong data-total>${team.totalScore}</strong></div>
            <div class="score-actions">
              <button type="button" class="score-btn minus" data-delta="-1" data-team-id="${team.id}" aria-label="${escapeHtml(team.name)} 扣 1 分">−</button>
              <button type="button" class="score-btn plus" data-delta="1" data-team-id="${team.id}" aria-label="${escapeHtml(team.name)} 加 1 分">＋</button>
            </div>
          </article>
        `).join('');
        builtCount = session.teamCount;

        boardEl.querySelectorAll('.team-card').forEach((card) => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.score-btn')) return;
            selectTeam(card.dataset.teamId);
          });
        });
        boardEl.querySelectorAll('.score-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            adjustScore(btn.dataset.teamId, Number(btn.dataset.delta));
          });
        });
      }

      function updateBoardScores() {
        const { isTie, hasLead, leaderIds } = rankInfo();
        activeTeams().forEach((team) => {
          const card = boardEl.querySelector(`.team-card[data-team-id="${team.id}"]`);
          if (!card) return;
          card.querySelector('[data-round]').textContent = String(team.roundScore);
          card.querySelector('[data-total]').textContent = String(team.totalScore);
          card.classList.toggle('is-selected', team.id === session.selectedTeamId);
          const isLeader = hasLead && leaderIds.has(team.id);
          card.classList.toggle('is-leader', isLeader && !isTie);
          card.classList.toggle('is-tie', isLeader && isTie);
        });
      }

      function buildCountChips() {
        teamCountChips.innerHTML = '';
        for (let n = 2; n <= MAX_TEAMS; n++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'chip';
          btn.dataset.count = String(n);
          btn.textContent = `${n} 組`;
          btn.addEventListener('click', () => {
            draftCount = n;
            syncCountChips();
            renderSetupNames();
          });
          teamCountChips.appendChild(btn);
        }
      }

      function syncCountChips() {
        teamCountChips.querySelectorAll('.chip').forEach((chip) => {
          chip.classList.toggle('is-active', Number(chip.dataset.count) === draftCount);
        });
      }

      function buildTimerChips() {
        timerChips.innerHTML = '';
        TIMER_PRESETS.forEach((preset) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `chip${preset.id === 'off' ? ' is-off' : ''}`;
          btn.dataset.preset = preset.id;
          btn.textContent = preset.label;
          btn.addEventListener('click', () => {
            draftTimerId = preset.id;
            syncTimerChips();
          });
          timerChips.appendChild(btn);
        });
      }

      function syncTimerChips() {
        timerChips.querySelectorAll('.chip').forEach((chip) => {
          chip.classList.toggle('is-active', chip.dataset.preset === draftTimerId);
        });
        customTimeEl.classList.toggle('open', draftTimerId === 'custom');
        if (draftTimerId !== 'custom' && draftTimerId !== 'off') {
          const preset = TIMER_PRESETS.find((p) => p.id === draftTimerId);
          if (preset && preset.sec != null) {
            timerMinutesEl.value = String(Math.floor(preset.sec / 60));
            timerSecondsEl.value = String(preset.sec % 60);
          }
        }
      }

      function renderSetupNames() {
        const existing = {};
        teamNamesEl.querySelectorAll('input[data-team-index]').forEach((input) => {
          existing[input.dataset.teamIndex] = input.value;
        });
        teamNamesEl.innerHTML = '';
        for (let i = 0; i < draftCount; i++) {
          const team = session.teams[i];
          const value = existing[i] != null ? existing[i] : team.name;
          const row = document.createElement('div');
          row.className = 'team-name-row';
          row.innerHTML = `
            <span class="swatch" style="--team-color: ${team.color}" title="${COLOR_NAMES[i]}"></span>
            <input type="text" maxlength="12" data-team-index="${i}" value="${escapeHtml(value)}" aria-label="第 ${i + 1} 組名稱" />
          `;
          teamNamesEl.appendChild(row);
        }
      }

      function applyNamePreset(kind) {
        teamNamesEl.querySelectorAll('input[data-team-index]').forEach((input) => {
          const i = Number(input.dataset.teamIndex);
          input.value = kind === 'color' ? COLOR_NAMES[i] : `第${i + 1}組`;
        });
      }

      function syncSetupForm() {
        draftCount = session.teamCount;
        draftTimerId = session.timer.presetId || guessPresetId(session.timer);
        const mins = Math.floor(session.timer.durationSec / 60);
        const secs = session.timer.durationSec % 60;
        timerMinutesEl.value = String(mins);
        timerSecondsEl.value = String(secs);
        syncCountChips();
        syncTimerChips();
        renderSetupNames();
      }

      function readSetupFormIntoSession() {
        const count = clampCount(draftCount);
        const prevTotals = session.teams.map((t) => t.totalScore);
        const prevRounds = session.teams.map((t) => t.roundScore);
        const names = Array.from(teamNamesEl.querySelectorAll('input[data-team-index]'))
          .sort((a, b) => Number(a.dataset.teamIndex) - Number(b.dataset.teamIndex))
          .map((input, i) => input.value.trim() || `第${i + 1}組`);

        session.teamCount = count;
        for (let i = 0; i < MAX_TEAMS; i++) {
          session.teams[i].name = names[i] || `第${i + 1}組`;
          session.teams[i].color = TEAM_COLORS[i];
          session.teams[i].totalScore = prevTotals[i] || 0;
          session.teams[i].roundScore = prevRounds[i] || 0;
        }

        const preset = TIMER_PRESETS.find((p) => p.id === draftTimerId) || TIMER_PRESETS[3];
        let enabled = !!preset.enabled;
        let durationSec = preset.sec == null ? 0 : preset.sec;
        if (preset.id === 'custom') {
          const mins = Math.max(0, Number(timerMinutesEl.value) || 0);
          const secs = Math.min(59, Math.max(0, Number(timerSecondsEl.value) || 0));
          durationSec = mins * 60 + secs;
          enabled = durationSec > 0;
          if (enabled && durationSec <= 0) durationSec = 60;
        }
        if (preset.id === 'off') {
          enabled = false;
          durationSec = 0;
        }

        session.timer.enabled = enabled;
        session.timer.durationSec = durationSec;
        session.timer.presetId = draftTimerId;
        if (!session.timer.running) {
          session.timer.remainingMs = durationSec * 1000;
        }

        if (!activeTeams().some((t) => t.id === session.selectedTeamId)) {
          session.selectedTeamId = session.teams[0].id;
        }
      }

      function updateHint() {
        if (session.mode === 'setup') {
          hintPill.textContent = '先按「開始本輪」，或打開設定三步完成';
        } else if (session.mode === 'live') {
          hintPill.textContent = '直接點各組 ＋／− · 數字鍵 1–8 選組';
        } else {
          hintPill.textContent = '本輪已鎖分 · 按「下一輪」繼續累計總分';
        }
      }

      function renderChrome() {
        modePill.dataset.mode = session.mode;
        modeLabel.textContent = MODE_LABELS[session.mode] || session.mode;
        roundLabel.textContent = String(session.roundIndex);
        document.body.classList.toggle('is-locked', session.mode === 'locked');
        document.body.classList.toggle('is-live', session.mode === 'live');
        document.body.classList.toggle('is-setup', session.mode === 'setup');
        document.body.classList.toggle('has-timer', !!(session.timer.enabled && session.mode === 'live'));

        const timerOn = session.timer.enabled;
        timerPill.classList.toggle('is-off', !timerOn);
        timerPill.classList.toggle('is-low', timerOn && session.timer.remainingMs <= 10000 && session.timer.remainingMs > 0);
        timerPill.textContent = timerOn ? formatTime(session.timer.remainingMs) : '無倒數';
        timerToggleLabel.textContent = session.timer.running ? '暫停倒數' : '繼續倒數';
        updateHint();
      }

      function render() {
        if (builtCount !== session.teamCount) rebuildBoard();
        updateBoardScores();
        renderChrome();
        persist();
      }

      function selectTeam(id) {
        if (!activeTeams().some((t) => t.id === id)) return;
        session.selectedTeamId = id;
        render();
      }

      function flashTeam(id, delta) {
        const card = boardEl.querySelector(`.team-card[data-team-id="${id}"]`);
        if (!card) return;
        card.classList.remove('is-flash-plus', 'is-flash-minus');
        void card.offsetWidth;
        card.classList.add(delta > 0 ? 'is-flash-plus' : 'is-flash-minus');
      }

      function adjustScore(teamId, delta) {
        if (session.mode !== 'live') {
          showToast(session.mode === 'locked' ? '已鎖分，請開下一輪' : '請先開始本輪');
          return;
        }
        const team = findTeam(teamId);
        if (!team || !activeTeams().some((t) => t.id === teamId)) return;
        team.roundScore += delta;
        team.totalScore += delta;
        session.selectedTeamId = teamId;
        flashTeam(teamId, delta);
        announceScore(team, delta);
        render();
      }

      function stopTimerLoop() {
        if (timerRaf) {
          cancelAnimationFrame(timerRaf);
          timerRaf = null;
        }
        lastTickAt = 0;
      }

      function lockRound(reason) {
        if (session.mode === 'locked') return;
        session.mode = 'locked';
        session.timer.running = false;
        stopTimerLoop();
        if (session.timer.enabled) session.timer.remainingMs = 0;
        playLockChime();
        showToast(reason || '本輪已鎖分');
        render();
      }

      function tickTimer(now) {
        if (!session.timer.running || session.mode !== 'live') {
          stopTimerLoop();
          return;
        }
        if (!lastTickAt) lastTickAt = now;
        const delta = now - lastTickAt;
        lastTickAt = now;
        session.timer.remainingMs = Math.max(0, session.timer.remainingMs - delta);
        if (session.timer.remainingMs <= 0) {
          session.timer.remainingMs = 0;
          lockRound('時間到，分數鎖定');
          return;
        }
        renderChrome();
        persist();
        timerRaf = requestAnimationFrame(tickTimer);
      }

      function startTimer() {
        if (!session.timer.enabled || session.mode !== 'live') return;
        if (session.timer.remainingMs <= 0) {
          session.timer.remainingMs = session.timer.durationSec * 1000;
        }
        session.timer.running = true;
        stopTimerLoop();
        lastTickAt = 0;
        timerRaf = requestAnimationFrame(tickTimer);
        render();
      }

      function pauseTimer() {
        session.timer.running = false;
        stopTimerLoop();
        render();
      }

      function toggleTimer() {
        if (!session.timer.enabled) {
          showToast('本輪未啟用倒數');
          return;
        }
        if (session.mode !== 'live') {
          showToast('倒數僅在進行中可用');
          return;
        }
        if (session.timer.running) pauseTimer();
        else startTimer();
      }

      function beginRound({ fromSetup = false } = {}) {
        if (fromSetup) readSetupFormIntoSession();
        session.mode = 'live';
        session.timer.running = false;
        stopTimerLoop();
        if (session.timer.enabled) {
          session.timer.remainingMs = session.timer.durationSec * 1000;
        }
        closeSetup();
        render();
        showToast(`第 ${session.roundIndex} 輪開始 · 直接點 ＋／−`);
        if (session.timer.enabled && session.timer.durationSec > 0) startTimer();
      }

      function nextRound() {
        if (session.mode !== 'locked') {
          showToast('請先鎖分再開下一輪');
          return;
        }
        activeTeams().forEach((t) => { t.roundScore = 0; });
        session.roundIndex += 1;
        session.mode = 'live';
        session.timer.running = false;
        stopTimerLoop();
        if (session.timer.enabled) {
          session.timer.remainingMs = session.timer.durationSec * 1000;
        }
        render();
        showToast(`第 ${session.roundIndex} 輪開始`);
        if (session.timer.enabled && session.timer.durationSec > 0) startTimer();
      }

      function resetRoundScores() {
        if (!(session.mode === 'setup' || session.mode === 'locked')) {
          showToast('進行中請先鎖分再重設本輪');
          return;
        }
        activeTeams().forEach((t) => { t.roundScore = 0; });
        render();
        showToast('本輪分數已歸零（總分不變）');
      }

      function resetTotals() {
        if (!confirm('確定重設所有組的總分與本輪分？')) return;
        session.teams.forEach((t) => {
          t.roundScore = 0;
          t.totalScore = 0;
        });
        session.roundIndex = 1;
        session.mode = 'setup';
        session.timer.running = false;
        stopTimerLoop();
        if (session.timer.enabled) {
          session.timer.remainingMs = session.timer.durationSec * 1000;
        }
        render();
        syncSetupForm();
        showToast('總分已重設');
      }

      function openSetup() {
        if (session.mode === 'live') {
          if (!confirm('回到設定會暫停倒數。確定開啟設定？')) return;
          pauseTimer();
        }
        syncSetupForm();
        setupOpen = true;
        setupDrawer.classList.add('open');
        setupDrawer.setAttribute('aria-hidden', 'false');
      }

      function closeSetup() {
        setupOpen = false;
        setupDrawer.classList.remove('open');
        setupDrawer.setAttribute('aria-hidden', 'true');
      }

      function toggleSetup() {
        if (setupOpen) closeSetup();
        else openSetup();
      }

      function setFullscreenButton(on) {
        fullscreenBtn.classList.toggle('active', !!on);
        fullscreenBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        fullscreenLabel.textContent = on ? '退出' : '全螢幕';
        fullscreenBtn.title = on ? '退出全螢幕 (F)' : '全螢幕 (F)';
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => showToast('全螢幕切換失敗'));
        } else {
          document.exitFullscreen?.();
        }
      }

      function moveSelection(delta) {
        const teams = activeTeams();
        if (!teams.length) return;
        let idx = teams.findIndex((t) => t.id === session.selectedTeamId);
        if (idx < 0) idx = 0;
        idx = (idx + delta + teams.length) % teams.length;
        selectTeam(teams[idx].id);
      }

      function handleHotkeys(e) {
        const tag = document.activeElement?.tagName?.toLowerCase();
        const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';

        if (e.key === 'Escape') {
          if (setupOpen) {
            e.preventDefault();
            closeSetup();
          }
          return;
        }

        if (isTyping) return;

        if (e.code === 'Space') {
          e.preventDefault();
          toggleTimer();
          return;
        }

        const key = e.key;
        if (key === 'f' || key === 'F') {
          e.preventDefault();
          toggleFullscreen();
          return;
        }
        if (key === 's' || key === 'S') {
          e.preventDefault();
          toggleSetup();
          return;
        }
        if (key === 'm' || key === 'M') {
          e.preventDefault();
          toggleSound();
          return;
        }
        if (key === 'l' || key === 'L') {
          e.preventDefault();
          if (session.mode === 'live') lockRound('手動鎖分');
          return;
        }
        if (key === 'n' || key === 'N') {
          e.preventDefault();
          nextRound();
          return;
        }
        if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetRoundScores();
          return;
        }
        if (key >= '1' && key <= '8') {
          const idx = Number(key) - 1;
          if (idx < session.teamCount) {
            e.preventDefault();
            selectTeam(session.teams[idx].id);
          }
          return;
        }
        if (key === '+' || key === '=') {
          e.preventDefault();
          adjustScore(session.selectedTeamId, 1);
          return;
        }
        if (key === '-' || key === '_') {
          e.preventDefault();
          adjustScore(session.selectedTeamId, -1);
          return;
        }
        if (key === 'ArrowRight' || key === 'ArrowDown') {
          e.preventDefault();
          moveSelection(1);
          return;
        }
        if (key === 'ArrowLeft' || key === 'ArrowUp') {
          e.preventDefault();
          moveSelection(-1);
          return;
        }
        if (key === 'Enter') {
          e.preventDefault();
          adjustScore(session.selectedTeamId, 1);
          return;
        }
        if (key === 'Backspace' || key === 'Delete') {
          e.preventDefault();
          adjustScore(session.selectedTeamId, -1);
        }
      }

      buildCountChips();
      buildTimerChips();

      btnSetup.addEventListener('click', toggleSetup);
      btnSound.addEventListener('click', toggleSound);
      btnOpenSetupAgain.addEventListener('click', openSetup);
      btnCloseSetup.addEventListener('click', closeSetup);
      setupDrawer.addEventListener('click', (e) => {
        if (e.target === setupDrawer) closeSetup();
      });
      btnApplyStart.addEventListener('click', () => beginRound({ fromSetup: true }));
      btnStartRound.addEventListener('click', () => {
        if (session.mode !== 'setup') return;
        beginRound({ fromSetup: setupOpen });
      });
      btnToggleTimer.addEventListener('click', toggleTimer);
      btnLock.addEventListener('click', () => {
        if (session.mode === 'live') lockRound('手動鎖分');
      });
      btnNextRound.addEventListener('click', nextRound);
      btnResetRound.addEventListener('click', resetRoundScores);
      btnResetTotals.addEventListener('click', resetTotals);
      btnNamesNumber.addEventListener('click', () => applyNamePreset('number'));
      btnNamesColor.addEventListener('click', () => applyNamePreset('color'));
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => setFullscreenButton(!!document.fullscreenElement));
      document.addEventListener('keydown', handleHotkeys);
      document.addEventListener('click', initAudioContext, { once: true });
      document.addEventListener('keydown', initAudioContext, { once: true });

      try {
        const savedSound = localStorage.getItem('edutv-scoreboard-sound');
        if (savedSound === '0') setSoundEnabled(false);
        else setSoundEnabled(true);
      } catch (_) {
        setSoundEnabled(true);
      }

      restore();
      rebuildBoard();
      render();
      if (session.mode === 'setup') openSetup();
    })();
  </script>
</body>

</html>

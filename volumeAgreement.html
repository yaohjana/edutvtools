<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>音量約定</title>
  <style>
    :root {
      --ok: #166534;
      --near: #b45309;
      --over: #be3a4a;
      --paused: #1e293b;
      --setup: #10261f;
      --ink: #f8fafc;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background: var(--setup);
      transition: background-color .45s ease;
    }
    @supports (height: 100svh) {
      body { height: 100svh; }
    }
    body.tone-setup { background: var(--setup); }
    body.tone-ok { background: var(--ok); }
    body.tone-near { background: var(--near); }
    body.tone-over { background: var(--over); }
    body.tone-paused, body.tone-error { background: var(--paused); }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: 0; color: inherit; }
    .panel { display: flex; flex-direction: column; height: 100%; min-height: 0; max-height: 100%; }
    .panel[hidden] { display: none !important; }

    .setup, .error {
      padding: calc(1.1rem + env(safe-area-inset-top)) calc(1.1rem + env(safe-area-inset-right)) calc(1.1rem + env(safe-area-inset-bottom)) calc(1.1rem + env(safe-area-inset-left));
      gap: .9rem;
    }
    .setup { width: min(920px, 100%); margin: 0 auto; overflow: hidden; }
    .error { overflow: auto; -webkit-overflow-scrolling: touch; }
    .setup-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: .04em;
      line-height: 1.15;
    }
    .lead, .error-body {
      margin: .35rem 0 0;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.55;
      color: rgba(248, 250, 252, .92);
    }
    .place {
      margin: 0;
      font-size: 1rem;
      color: rgba(248, 250, 252, .78);
    }
    .scene-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .65rem;
    }
    @media (min-width: 700px) {
      .scene-grid { grid-template-columns: 1fr 1fr; }
    }
    .scene-card {
      text-align: left;
      background: rgba(255, 255, 255, .08);
      border: 3px solid transparent;
      border-radius: 1.1rem;
      padding: .85rem 1rem;
      min-height: 4.8rem;
    }
    .scene-card[aria-pressed="true"] {
      background: rgba(255, 255, 255, .16);
      border-color: #fff;
    }
    .scene-name { display: block; font-size: 1.35rem; font-weight: 800; }
    .scene-line { display: block; margin-top: .2rem; font-size: 1.02rem; line-height: 1.4; color: rgba(248, 250, 252, .88); }
    .setup-actions { display: flex; flex-wrap: wrap; gap: .7rem; align-items: stretch; flex: 0 0 auto; }
    .toggle, .primary, .ghost, .retry {
      border-radius: 1rem;
      font-weight: 800;
      font-size: 1.2rem;
      min-height: 3.6rem;
      padding: .75rem 1.1rem;
    }
    .toggle, .ghost {
      background: rgba(255, 255, 255, .14);
    }
    .toggle[aria-pressed="true"], .ghost[aria-pressed="true"] { background: #fff; color: #10261f; }
    .primary, .retry {
      background: #fff;
      color: #10261f;
      flex: 1 1 16rem;
    }
    .foot {
      margin: .75rem 0 0;
      text-align: right;
      color: rgba(248, 250, 252, .55);
      font-size: .85rem;
    }

    .live {
      padding: calc(.75rem + env(safe-area-inset-top)) calc(.9rem + env(safe-area-inset-right)) calc(.8rem + env(safe-area-inset-bottom)) calc(.9rem + env(safe-area-inset-left));
      gap: .55rem;
      overflow: hidden;
    }
    .live-main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: .55rem;
    }
    .live-head { text-align: center; }
    #scene-label { margin: 0; font-size: clamp(1.15rem, 2.5vw, 1.5rem); font-weight: 800; }
    #agreement-text { margin: .2rem 0 0; font-size: clamp(1rem, 2.2vw, 1.35rem); line-height: 1.4; }
    #status-text {
      margin: 0;
      text-align: center;
      font-size: clamp(2.7rem, 8vw, 5.6rem);
      font-weight: 900;
      letter-spacing: .04em;
      line-height: 1.12;
    }
    body.tone-over #status-text { animation: arrive .45s ease; }
    @keyframes arrive { from { transform: scale(.97); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      body, body.tone-over #status-text { transition: none; animation: none; }
    }
    .meter-wrap { position: relative; margin: .35rem .2rem .4rem; padding-top: 1.8rem; }
    .meter {
      height: clamp(4.4rem, 18vh, 8.2rem);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, .22);
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0;
      background: rgba(255, 255, 255, .94);
      border-radius: inherit;
    }
    .meter-line {
      position: absolute;
      left: 72%;
      top: 1.8rem;
      bottom: -.15rem;
      width: 4px;
      margin-left: -2px;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, .28);
      border-radius: 999px;
    }
    .meter-line span {
      position: absolute;
      top: -1.35rem;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: .12em;
      white-space: nowrap;
    }
    .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem; }
    .pill {
      min-width: 4.5rem;
      min-height: 2.9rem;
      padding: .35rem .85rem;
      border-radius: 999px;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, .75);
      font-size: 1.08rem;
      font-weight: 800;
    }
    .pill[aria-pressed="true"] { background: #fff; color: #10261f; border-color: #fff; }
    .live-actions { display: flex; flex-wrap: nowrap; justify-content: center; gap: .5rem; flex: 0 0 auto; }
    .live-actions .icon-btn {
      flex: 1 1 0;
      max-width: 8.5rem;
      min-width: 0;
      min-height: 4.4rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, .16);
      border: 2px solid rgba(255, 255, 255, .72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      padding: .35rem .25rem;
      font-size: .95rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .live-actions .icon-btn svg { width: 1.7rem; height: 1.7rem; display: block; }
    .live-actions .icon-btn .icon-play,
    .live-actions .icon-btn.is-paused .icon-pause { display: none; }
    .live-actions .icon-btn.is-paused .icon-play { display: block; }
    .live-actions .icon-btn[aria-pressed="true"] .icon-slash { display: none; }
    .live-actions .icon-btn[aria-pressed="true"] {
      background: #fff;
      color: #10261f;
      border-color: #fff;
    }
    #class-count { margin: .2rem 0 0; font-size: 1.05rem; font-weight: 800; opacity: .9; }
    #class-count[hidden] { display: none !important; }

    .wave {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      padding: calc(.7rem + env(safe-area-inset-top)) calc(.85rem + env(safe-area-inset-right)) calc(.75rem + env(safe-area-inset-bottom)) calc(.85rem + env(safe-area-inset-left));
      background: #0b1220;
      color: #f8fafc;
      overflow: auto;
    }
    .wave[hidden] { display: none !important; }
    .wave-top, .count-row, .hold-row, .slider-ends { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .wave-top { justify-content: space-between; }
    .count-row p { margin: 0; font-size: 1.25rem; font-weight: 900; }
    .wave button, .wave .toggle {
      min-height: 3rem;
      border-radius: .9rem;
      padding: .55rem .9rem;
      font-weight: 800;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, .12);
      border: 2px solid rgba(255, 255, 255, .55);
    }
    .wave .toggle[aria-pressed="true"] { background: #fff; color: #0b1220; border-color: #fff; }
    .wave-status { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; }
    .wave-status.ok { color: #86efac; }
    .wave-status.near { color: #fcd34d; }
    .wave-status.over { color: #fda4af; }
    .wave-status.paused { color: #cbd5e1; }
    .wave-hint { margin: 0; font-size: 1rem; line-height: 1.45; color: rgba(248, 250, 252, .82); }
    .wave-body { display: flex; flex-direction: column; gap: .7rem; min-height: 0; }
    .wave-stage { position: relative; flex: 1 1 220px; min-height: 220px; }
    #wave-canvas {
      width: 100%;
      height: 100%;
      min-height: 220px;
      display: block;
      border-radius: 1.1rem;
      background: #020617;
      touch-action: none;
    }
    .line-tag {
      position: absolute;
      left: .6rem;
      transform: translateY(-50%);
      background: #fde68a;
      color: #1c1917;
      font-weight: 900;
      font-size: .95rem;
      letter-spacing: .08em;
      border-radius: 999px;
      padding: .2rem .55rem;
      pointer-events: none;
    }
    .wave-tools { display: flex; flex-direction: column; gap: .75rem; }
    .wave-tools .pill { min-width: 3.5rem; }
    .slider-label { display: flex; flex-direction: column; gap: .35rem; font-weight: 800; font-size: 1.05rem; }
    #gain-slider { width: 100%; accent-color: #fde68a; height: 2.2rem; }
    .slider-ends { justify-content: space-between; font-weight: 700; font-size: .95rem; color: rgba(248, 250, 252, .8); }
    .hold-row span { font-weight: 800; margin-right: .2rem; }
    .hold-presets { display: flex; flex-wrap: wrap; gap: .4rem; }
    .hold-presets .toggle { min-height: 2.75rem; padding: .35rem .7rem; font-size: 1rem; }
    .hold-custom { display: flex; align-items: center; gap: .45rem; }
    .hold-custom .toggle { min-width: 2.8rem; min-height: 2.8rem; font-size: 1.4rem; padding: 0; }
    #hold-input {
      width: 5.2rem;
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      border-radius: .7rem;
      border: 2px solid #fde68a;
      background: #020617;
      color: #fff;
      padding: .35rem .2rem;
    }
    #hold-input::-webkit-outer-spin-button,
    #hold-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .hold-note { margin: 0; font-size: .95rem; line-height: 1.45; color: rgba(248, 250, 252, .75); }
    #gain-readout { font-variant-numeric: tabular-nums; }
    @media (min-width: 980px) and (max-height: 860px) {
      .wave { overflow: hidden; }
      .wave-body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); flex: 1; min-height: 0; }
      .wave-tools { overflow: auto; min-height: 0; }
    }
    @media (max-width: 720px), (max-height: 520px) {
      h1 { font-size: 1.65rem; }
      .lead, .error-body { font-size: 1rem; }
      .place { font-size: .92rem; }
      .scene-card { min-height: 0; padding: .6rem .75rem; }
      .scene-name { font-size: 1.12rem; }
      .scene-line { font-size: .95rem; }
      .toggle, .primary, .ghost, .retry { font-size: 1.05rem; min-height: 3.1rem; }
      #status-text { font-size: clamp(1.55rem, 7.5vw, 2.4rem); margin-bottom: .2rem; }
      .meter-wrap { margin: .7rem .1rem .15rem; padding-top: 1.35rem; }
      .meter { height: clamp(2.2rem, 11vh, 3.6rem); }
      .meter-line { top: 1.35rem; }
      .meter-line span { font-size: .85rem; top: -1.15rem; }
      .pill { min-width: 0; min-height: 2.45rem; padding: .25rem .65rem; font-size: .98rem; }
      .live-actions .icon-btn { min-height: 4rem; font-size: .88rem; }
      .live-actions .icon-btn svg { width: 1.45rem; height: 1.45rem; }
      .wave { gap: .4rem; }
      .wave-stage, #wave-canvas { min-height: 132px; flex-basis: 132px; }
      .wave-top { position: sticky; top: 0; z-index: 2; background: #0b1220; }
      .hold-presets .toggle { min-height: 2.5rem; padding: .3rem .55rem; }
      .settle-ask { font-size: clamp(1.45rem, 7vw, 2.4rem); letter-spacing: .04em; }
      #settle-count { font-size: min(12rem, 34vw, 34vh); }
      .settle-line { font-size: clamp(1.05rem, 4vw, 1.6rem); }
      .settle-bars { height: clamp(2.2rem, 8vh, 3.4rem); }
    }
    .error { width: min(760px, 100%); margin: 0 auto; justify-content: center; }
    .error h1 { font-size: clamp(2.2rem, 6vw, 4rem); }
    .retry { flex: none; min-width: min(100%, 18rem); align-self: flex-start; }

    .settle {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
      background: #9f2d3c;
      text-align: center;
    }
    .settle[hidden] { display: none !important; }
    .settle-ask {
      margin: 0;
      font-size: clamp(2rem, 6.2vw, 4.4rem);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1.15;
    }
    .settle-count-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin: 0;
      line-height: .82;
    }
    #settle-count {
      font-size: min(18rem, 32vw, 46vh);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
    }
    #settle-count.tick { animation: settle-pop .35s ease; }
    .settle-unit {
      margin-left: .12em;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 900;
    }
    .settle-bars {
      display: flex;
      align-items: flex-end;
      gap: .55rem;
      height: clamp(3.4rem, 12vh, 6rem);
      margin: .35rem 0 .15rem;
    }
    .settle-bars span {
      width: clamp(1.05rem, 3.2vw, 1.9rem);
      border-radius: .5rem;
      background: rgba(255, 255, 255, .94);
      transform-origin: bottom center;
      transition: transform .35s ease, opacity .35s ease;
    }
    .settle-bars span:nth-child(1) { height: 38%; }
    .settle-bars span:nth-child(2) { height: 54%; }
    .settle-bars span:nth-child(3) { height: 70%; }
    .settle-bars span:nth-child(4) { height: 86%; }
    .settle-bars span:nth-child(5) { height: 100%; }
    .settle-bars span.down { transform: scaleY(.18); opacity: .28; }
    .settle-line {
      margin: .15rem 0 0;
      font-size: clamp(1.35rem, 3.6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: .04em;
    }
    @keyframes settle-pop { from { transform: scale(.92); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #settle-count.tick, .settle-bars span { animation: none; transition: none; }
    }
  </style>
</head>
<body class="tone-setup">
  <section id="panel-setup" class="panel setup">
    <div class="setup-scroll">
      <div>
        <h1>音量約定</h1>
        <p class="lead">選一個情境，一起看音量。超過約定時，畫面會停下數秒，請大家把聲音放輕。</p>
        <p class="place">把平板放在教室中段、螢幕朝外。聲音只留在這台裝置上，用來換成音量高低。</p>
      </div>
      <div id="scene-grid" class="scene-grid"></div>
      <p class="foot">Developed by DennisZ</p>
    </div>
    <div class="setup-actions">
      <button id="setup-chime" class="toggle" type="button" aria-pressed="true">輕聲提醒 · 開</button>
      <button id="start-btn" class="primary" type="button">開始一起看音量</button>
    </div>
  </section>

  <section id="panel-live" class="panel live" hidden>
    <div class="live-main">
      <div class="live-head">
        <p id="scene-label">討論</p>
        <p id="agreement-text">小組聲，讓鄰組也能討論</p>
        <p id="class-count" hidden>本節超過 0 次</p>
      </div>
      <div>
        <p id="status-text" aria-live="polite">維持這個音量</p>
        <div class="meter-wrap">
          <div class="meter-line" aria-hidden="true"><span>約定</span></div>
          <div id="meter" class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="維持這個音量">
            <div id="meter-fill" class="meter-fill"></div>
          </div>
        </div>
      </div>
      <div id="pills" class="pills"></div>
    </div>
    <div class="live-actions">
      <button id="pause-btn" class="icon-btn" type="button" aria-label="暫停">
        <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M8 5v14"/><path d="M16 5v14"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>
        </svg>
        <span id="pause-label">暫停</span>
      </button>
      <button id="wave-open-btn" class="icon-btn" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M9.7 2.6h4.6l.4 2.2c.6.2 1.2.5 1.7.9l2-1 2.9 2.9-1 2c.4.5.7 1.1.9 1.7l2.2.4v4.6l-2.2.4c-.2.6-.5 1.2-.9 1.7l1 2-2.9 2.9-2-1c-.5.4-1.1.7-1.7.9l-.4 2.2H9.7l-.4-2.2c-.6-.2-1.2-.5-1.7-.9l-2 1-2.9-2.9 1-2c-.4-.5-.7-1.1-.9-1.7l-2.2-.4V9.7l2.2-.4c.2-.6.5-1.2.9-1.7l-1-2 2.9-2.9 2 1c.5-.4 1.1-.7 1.7-.9l.4-2.2zM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"/>
        </svg>
        <span>設定</span>
      </button>
      <button id="live-chime" class="icon-btn ghost" type="button" aria-pressed="true" aria-label="輕聲提醒，目前開著">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 16.5h12"/>
          <path d="M7.1 16.5c.7-1.5 1.1-2.7 1.1-4.2V9a3.8 3.8 0 0 1 7.6 0v3.3c0 1.5.4 2.7 1.1 4.2"/>
          <path d="M10 16.7a2 2 0 0 0 4 0"/>
          <path class="icon-slash" d="M5 19.2 19 5.2"/>
        </svg>
        <span id="chime-label">提醒開</span>
      </button>
    </div>
  </section>

  <section id="panel-wave" class="wave" hidden>
    <div class="wave-top">
      <button id="wave-close" type="button">回到課堂</button>
      <div class="count-row">
        <p id="over-count">本節超過 0 次</p>
        <button id="count-reset" type="button">重新計算</button>
      </div>
    </div>
    <p id="wave-status" class="wave-status ok">維持這個音量</p>
    <p id="wave-hint" class="wave-hint"></p>
    <div class="wave-body">
      <div class="wave-stage">
        <canvas id="wave-canvas" role="slider" tabindex="0" aria-valuemin="2" aria-valuemax="90" aria-valuenow="14" aria-label="音量標準，上下拖動調整"></canvas>
        <div id="line-tag" class="line-tag">標準</div>
      </div>
      <div class="wave-tools">
        <button id="standard-now" type="button">以現在為標準</button>
        <label class="slider-label" for="gain-slider">敏感度 · <span id="gain-readout">8 倍</span>
          <input id="gain-slider" type="range" min="0.5" max="16" step="0.1" value="8" aria-label="敏感度">
          <span class="slider-ends"><span>0.5 倍</span><span>16 倍</span></span>
        </label>
        <div class="hold-block">
          <div class="hold-row" role="group" aria-label="持續時間">
            <span>持續時間</span>
            <div id="hold-presets" class="hold-presets"></div>
          </div>
          <div class="hold-custom">
            <span>自訂</span>
            <button id="hold-minus" class="toggle" type="button" aria-label="減少 0.1 秒">−</button>
            <input id="hold-input" type="number" min="0.2" max="5" step="0.1" inputmode="decimal" value="0.6" aria-label="自訂秒數">
            <span>秒</span>
            <button id="hold-plus" class="toggle" type="button" aria-label="增加 0.1 秒">＋</button>
          </div>
          <p class="hold-note">平板麥克風常有降噪，持續時間短一點比較容易觸發。</p>
        </div>
        <button id="count-class" class="toggle" type="button" aria-pressed="false">課堂畫面也顯示次數</button>
        <button id="wave-pause" type="button">暫停</button>
        <div id="wave-pills" class="pills"></div>
      </div>
    </div>
  </section>

  <section id="panel-settle" class="settle" hidden>
    <p class="settle-ask">請把聲音放輕</p>
    <p class="settle-count-row"><span id="settle-count" aria-live="polite">5</span><span class="settle-unit">秒</span></p>
    <div class="settle-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="settle-line">我們一起回到約定</p>
  </section>

  <section id="panel-error" class="panel error" hidden>
    <h1 id="error-title"></h1>
    <p id="error-body" class="error-body"></p>
    <button id="retry-btn" class="retry" type="button">再試一次</button>
  </section>

  <script>
    const SCENES = [
      { id: 'exam', name: '測驗', agreement: '安靜作答，只留筆聲和翻頁', limit: 0.035 },
      { id: 'study', name: '自習', agreement: '輕聲，讓每個人都能想', limit: 0.07 },
      { id: 'talk', name: '討論', agreement: '小組聲，讓鄰組也能討論', limit: 0.14 },
      { id: 'make', name: '實作', agreement: '工作聲，說得清楚，也聽得見老師', limit: 0.24 },
      { id: 'play', name: '活動', agreement: '參與聲，玩得開心，指示還聽得見', limit: 0.36 },
      { id: 'chorus', name: '齊讀', agreement: '齊讀聲，聲音齊，不另外加油添醋', limit: 0.52 }
    ];
    const SETTLE_MS = 5000;
    const LISTEN_GAP_MS = 450;
    const THANKS_MS = 2000;
    const NEAR_RATIO = 0.8;
    const LINE_AT = 0.72;
    const NOISE_FLOOR = 0.008;
    const AMP_MAX = 0.85;
    const GAIN_MIN = 0.5;
    const GAIN_MAX = 16;
    const GAIN_DEFAULT = 8;
    const HISTORY_MS = 8000;
    const HOLD_PRESETS = [300, 400, 500, 600, 800, 1000, 1500, 2000];
    const HOLD_MIN = 200;
    const HOLD_MAX = 5000;

    const setupPanel = document.getElementById('panel-setup');
    const livePanel = document.getElementById('panel-live');
    const errorPanel = document.getElementById('panel-error');
    const sceneGrid = document.getElementById('scene-grid');
    const pills = document.getElementById('pills');
    const wavePills = document.getElementById('wave-pills');
    const startBtn = document.getElementById('start-btn');
    const setupChime = document.getElementById('setup-chime');
    const liveChime = document.getElementById('live-chime');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseLabel = document.getElementById('pause-label');
    const chimeLabel = document.getElementById('chime-label');
    const wavePauseBtn = document.getElementById('wave-pause');
    const retryBtn = document.getElementById('retry-btn');
    const sceneLabel = document.getElementById('scene-label');
    const agreementText = document.getElementById('agreement-text');
    const statusText = document.getElementById('status-text');
    const classCount = document.getElementById('class-count');
    const meter = document.getElementById('meter');
    const meterFill = document.getElementById('meter-fill');
    const errorTitle = document.getElementById('error-title');
    const errorBody = document.getElementById('error-body');
    const wavePanel = document.getElementById('panel-wave');
    const waveCanvas = document.getElementById('wave-canvas');
    const waveStatus = document.getElementById('wave-status');
    const waveHint = document.getElementById('wave-hint');
    const lineTag = document.getElementById('line-tag');
    const overCountText = document.getElementById('over-count');
    const gainSlider = document.getElementById('gain-slider');
    const gainReadout = document.getElementById('gain-readout');
    const holdPresets = document.getElementById('hold-presets');
    const holdInput = document.getElementById('hold-input');
    const countClassBtn = document.getElementById('count-class');
    const standardNowBtn = document.getElementById('standard-now');
    const settlePanel = document.getElementById('panel-settle');
    const settleCount = document.getElementById('settle-count');
    const settleBars = [...settlePanel.querySelectorAll('.settle-bars span')];

    let sceneId = 'talk';
    let threshold = 0.14;
    let customKind = '0';
    let chimeOn = true;
    let sensitivity = GAIN_DEFAULT;
    let holdMs = 600;
    let countOnClass = false;
    let overCount = 0;
    let waveOpen = false;
    let draggingLine = false;
    let paused = false;
    let running = false;
    let opening = false;
    let smoothed = 0;
    let haveLevel = false;
    let overMs = 0;
    let quietSince = 0;
    let lastFrameAt = 0;
    let chimeUrl = '';
    let settling = false;
    let settleUntil = 0;
    let settleShown = 0;
    let resumeListenAt = 0;
    const chimeAudio = new Audio();
    chimeAudio.preload = 'auto';
    chimeAudio.setAttribute('playsinline', '');
    let cueToken = 0;
    let cueGain = null;
    let phase = 'ok';
    let thanksUntil = 0;
    let pendingThanks = false;
    let rafId = 0;
    let recent = [];
    let history = [];
    let audioCtx = null;
    let stream = null;
    let analyser = null;
    let timeBuf = null;
    let wakeLock = null;

    function sceneById(id) {
      return SCENES.find((scene) => scene.id === id) || SCENES[2];
    }

    function isAppleTouch() {
      const ua = navigator.userAgent || '';
      if (/iPad|iPhone|iPod/.test(ua)) return true;
      return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    }

    function micCopy(kind, appleTouch) {
      if (kind === 'insecure') {
        return {
          title: '請用網址開啟',
          body: '直接打開檔案時，平板不會允許使用麥克風。請用學校提供的網址開啟這個畫面。'
        };
      }
      if (kind === 'denied') {
        return appleTouch
          ? {
              title: '請允許麥克風',
              body: '打開 iPad 的「設定」，點 Safari，再點麥克風，改成允許。回到這個畫面後，按再試一次。'
            }
          : {
              title: '請允許麥克風',
              body: '點網址列旁的麥克風圖示，改成允許。若系統的隱私權設定關閉了麥克風，請一併打開，再按再試一次。'
            };
      }
      if (kind === 'notfound') {
        return {
          title: '這台電腦沒有麥克風',
          body: '請改用平板開啟，或接上麥克風後再試一次。'
        };
      }
      if (kind === 'unsupported') {
        return {
          title: '這個瀏覽器無法使用麥克風',
          body: '請改用 iPad 的 Safari，或電腦上的 Chrome、Edge 開啟。'
        };
      }
      return {
        title: '麥克風目前接不上',
        body: '請確認沒有其他程式正在使用麥克風，或重新接上後再試一次。'
      };
    }

    function classifyMicError(err) {
      const name = err && err.name ? err.name : '';
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') return 'denied';
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return 'notfound';
      if (name === 'NotReadableError' || name === 'TrackStartError' || name === 'AbortError') return 'unreadable';
      return 'unreadable';
    }

    function loadSettings() {
      const saved = localStorage.getItem('va-scene');
      const scene = sceneById(saved || 'talk');
      sceneId = scene.id;
      chimeOn = localStorage.getItem('va-chime') !== '0';
      customKind = localStorage.getItem('va-custom') || '0';
      if (customKind === '1') customKind = 'drag';
      const stored = parseFloat(localStorage.getItem('va-threshold'));
      threshold = isCustom() && stored > 0 ? stored : scene.limit;
      const gain = parseFloat(localStorage.getItem('va-gain'));
      sensitivity = gain >= GAIN_MIN && gain <= GAIN_MAX ? gain : GAIN_DEFAULT;
      const hold = parseInt(localStorage.getItem('va-hold'), 10);
      holdMs = hold >= HOLD_MIN && hold <= HOLD_MAX ? hold : 600;
      countOnClass = localStorage.getItem('va-count-class') === '1';
    }

    function saveSettings() {
      localStorage.setItem('va-scene', sceneId);
      localStorage.setItem('va-threshold', String(threshold));
      localStorage.setItem('va-custom', customKind);
      localStorage.setItem('va-chime', chimeOn ? '1' : '0');
      localStorage.setItem('va-gain', String(sensitivity));
      localStorage.setItem('va-hold', String(holdMs));
      localStorage.setItem('va-count-class', countOnClass ? '1' : '0');
    }

    function isCustom() {
      return customKind === 'now' || customKind === 'drag';
    }

    function formatSeconds(ms) {
      const seconds = Math.round(ms / 100) / 10;
      return (seconds % 1 === 0 ? String(seconds) : seconds.toFixed(1)) + ' 秒';
    }

    function formatGain(value) {
      const multiple = Math.round(value * 10) / 10;
      return (multiple % 1 === 0 ? String(multiple) : multiple.toFixed(1)) + ' 倍';
    }

    function clampHold(ms) {
      const stepped = Math.round(ms / 100) * 100;
      return Math.max(HOLD_MIN, Math.min(HOLD_MAX, stepped));
    }

    function quietResetMs() {
      return Math.min(350, Math.max(120, Math.round(holdMs * 0.6)));
    }

    function buildHoldChoices() {
      HOLD_PRESETS.forEach((ms) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toggle';
        btn.dataset.hold = String(ms);
        btn.textContent = formatSeconds(ms);
        btn.addEventListener('click', () => setHold(ms));
        holdPresets.appendChild(btn);
      });
    }

    function setHold(ms) {
      holdMs = clampHold(ms);
      overMs = 0;
      quietSince = 0;
      saveSettings();
      renderSceneUi();
    }

    function buildChoices() {
      SCENES.forEach((scene) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'scene-card';
        card.dataset.scene = scene.id;
        card.innerHTML = '<span class="scene-name"></span><span class="scene-line"></span>';
        card.querySelector('.scene-name').textContent = scene.name;
        card.querySelector('.scene-line').textContent = scene.agreement;
        card.addEventListener('click', () => selectScene(scene.id));
        sceneGrid.appendChild(card);

        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'pill';
        pill.dataset.scene = scene.id;
        pill.textContent = scene.name;
        pill.addEventListener('click', () => selectScene(scene.id));
        pills.appendChild(pill);

        const wavePill = pill.cloneNode(true);
        wavePill.addEventListener('click', () => selectScene(scene.id));
        wavePills.appendChild(wavePill);
      });
    }

    function customLabel(name) {
      if (customKind === 'now') return name + ' · 已以現在為標準';
      if (customKind === 'drag') return name + ' · 標準已調整';
      return name;
    }

    function renderSceneUi() {
      const scene = sceneById(sceneId);
      document.querySelectorAll('[data-scene]').forEach((el) => {
        el.setAttribute('aria-pressed', el.dataset.scene === sceneId ? 'true' : 'false');
      });
      sceneLabel.textContent = customLabel(scene.name);
      agreementText.textContent = scene.agreement;
      const setupChimeLabel = chimeOn ? '輕聲提醒 · 開' : '輕聲提醒 · 關';
      setupChime.textContent = setupChimeLabel;
      chimeLabel.textContent = chimeOn ? '提醒開' : '提醒關';
      setupChime.setAttribute('aria-pressed', chimeOn ? 'true' : 'false');
      liveChime.setAttribute('aria-pressed', chimeOn ? 'true' : 'false');
      liveChime.setAttribute('aria-label', chimeOn ? '輕聲提醒，目前開著' : '輕聲提醒，目前關著');
      gainSlider.value = String(sensitivity);
      gainReadout.textContent = formatGain(sensitivity);
      document.querySelectorAll('[data-hold]').forEach((btn) => {
        btn.setAttribute('aria-pressed', Number(btn.dataset.hold) === holdMs ? 'true' : 'false');
      });
      if (document.activeElement !== holdInput) holdInput.value = (holdMs / 1000).toFixed(1);
      countClassBtn.setAttribute('aria-pressed', countOnClass ? 'true' : 'false');
      waveHint.textContent = '白線是音量標準。敏感度最高可放大 16 倍。波形要連續留在白線外 ' + formatSeconds(holdMs) + '，才會全畫面提醒。提醒的這幾秒先不偵測。';
      const shown = Math.round((threshold / AMP_MAX) * 100);
      waveCanvas.setAttribute('aria-valuenow', String(Math.max(2, Math.min(90, shown))));
      renderCount();
    }

    function selectScene(id) {
      if (settling) cancelSettle();
      const scene = sceneById(id);
      sceneId = scene.id;
      threshold = scene.limit;
      customKind = '0';
      overMs = 0;
      quietSince = 0;
      saveSettings();
      renderSceneUi();
    }

    function renderCount() {
      const text = '本節超過 ' + overCount + ' 次';
      overCountText.textContent = text;
      classCount.textContent = text;
      classCount.hidden = !countOnClass;
    }

    function resetOverCount() {
      overCount = 0;
      renderCount();
    }

    function setChime(on) {
      const was = chimeOn;
      chimeOn = !!on;
      if (settling && was && !chimeOn) stopCue();
      if (settling && !was && chimeOn) playChime();
      saveSettings();
      renderSceneUi();
    }

    function showPanel(name) {
      setupPanel.hidden = name !== 'setup';
      livePanel.hidden = name !== 'live';
      errorPanel.hidden = name !== 'error';
    }

    function applyTone(tone) {
      document.body.className = 'tone-' + tone;
    }

    function stopMeter() {
      running = false;
      paused = false;
      endSettleScreen();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function showMicMessage(kind) {
      stopMeter();
      closeWave();
      const copy = micCopy(kind, isAppleTouch());
      errorTitle.textContent = copy.title;
      errorBody.textContent = copy.body;
      showPanel('error');
      applyTone('error');
      retryBtn.hidden = kind === 'insecure';
      if (!retryBtn.hidden) retryBtn.focus();
    }

    function setStatus(text) {
      if (statusText.textContent !== text) statusText.textContent = text;
      meter.setAttribute('aria-valuetext', text);
    }

    function paint(ratio, tone, sentence) {
      const width = Math.max(0, Math.min(100, (ratio / (1 / LINE_AT)) * 100));
      meterFill.style.width = width + '%';
      const shown = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      meter.setAttribute('aria-valuenow', String(shown));
      applyTone(tone);
      setStatus(sentence);
      waveStatus.textContent = sentence;
      waveStatus.className = 'wave-status ' + (tone === 'paused' ? 'paused' : tone);
    }

    function readRms() {
      if (!analyser || !timeBuf) return 0;
      analyser.getByteTimeDomainData(timeBuf);
      let sum = 0;
      for (let i = 0; i < timeBuf.length; i++) {
        const v = (timeBuf[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / timeBuf.length);
    }

    function setAudioRoute(type) {
      try {
        if (navigator.audioSession && 'type' in navigator.audioSession) navigator.audioSession.type = type;
      } catch (e) {}
    }

    function resumeAudio() {
      setAudioRoute('play-and-record');
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') audioCtx.resume().catch(() => {});
    }

    function makeBellWav() {
      const rate = 22050;
      const dur = 4.65;
      const length = Math.floor(rate * dur);
      const data = new Float32Array(length);
      const notes = [
        { f: 784, t: 0, a: 0.9, d: 1.15 },
        { f: 659.25, t: 0.32, a: 0.75, d: 1.2 },
        { f: 523.25, t: 0.64, a: 0.62, d: 1.05 },
        { f: 659.25, t: 1.9, a: 0.5, d: 0.7 },
        { f: 523.25, t: 2.9, a: 0.44, d: 0.7 },
        { f: 392, t: 3.9, a: 0.38, d: 0.7 }
      ];
      const partials = [[1, 1], [2.01, 0.4], [2.76, 0.2], [3.95, 0.08]];
      notes.forEach((note) => {
        const start = Math.floor(note.t * rate);
        const span = Math.floor(note.d * rate);
        for (let i = 0; i < span && start + i < length; i++) {
          const time = i / rate;
          const env = Math.exp(-3.1 * time);
          let sample = 0;
          partials.forEach(([ratio, weight]) => {
            sample += Math.sin(2 * Math.PI * note.f * ratio * time) * weight;
          });
          data[start + i] += sample * env * note.a;
        }
      });
      let peak = 0;
      for (let i = 0; i < length; i++) peak = Math.max(peak, Math.abs(data[i]));
      const scale = peak > 0 ? 0.92 / peak : 1;
      const bytes = new ArrayBuffer(44 + length * 2);
      const view = new DataView(bytes);
      const text = (offset, value) => { for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i)); };
      text(0, 'RIFF');
      view.setUint32(4, 36 + length * 2, true);
      text(8, 'WAVE');
      text(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      text(36, 'data');
      view.setUint32(40, length * 2, true);
      for (let i = 0; i < length; i++) {
        const v = Math.max(-1, Math.min(1, data[i] * scale));
        view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      }
      return URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    }

    function prepareChime() {
      if (chimeUrl) return;
      chimeUrl = makeBellWav();
      chimeAudio.src = chimeUrl;
    }

    function unlockChime() {
      prepareChime();
      const token = ++cueToken;
      chimeAudio.muted = false;
      chimeAudio.volume = 0.001;
      const pending = chimeAudio.play();
      if (!pending || !pending.then) return;
      pending.then(() => {
        if (token !== cueToken) return;
        chimeAudio.pause();
        try { chimeAudio.currentTime = 0; } catch (e) {}
      }).catch(() => {});
    }

    function scheduleChime(context, t) {
      const master = context.createGain();
      cueGain = master;
      master.gain.setValueAtTime(0.9, t);
      master.connect(context.destination);
      const strike = (freq, start, peak, dur) => {
        [[1, 1], [2.01, 0.42], [2.76, 0.22], [3.95, 0.1]].forEach(([ratio, weight]) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = 'sine';
          const f = freq * ratio;
          osc.frequency.setValueAtTime(f, start);
          osc.frequency.exponentialRampToValueAtTime(Math.max(1, f * 0.985), start + dur);
          const level = Math.max(0.001, peak * weight);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(level, start + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(gain);
          gain.connect(master);
          osc.start(start);
          osc.stop(start + dur + 0.04);
        });
      };
      strike(783.99, t, 0.42, 1.15);
      strike(659.25, t + 0.34, 0.34, 1.25);
      strike(523.25, t + 0.68, 0.28, 1.45);
      strike(659.25, t + 1.9, 0.22, 0.7);
      strike(523.25, t + 2.9, 0.18, 0.7);
      strike(392, t + 3.9, 0.16, 0.7);
    }

    function playChimeWebAudio(token) {
      if (token !== cueToken || !settling) return;
      if (playChimeWebAudio.token === token) return;
      playChimeWebAudio.token = token;
      if (!audioCtx || audioCtx.state === 'closed') {
        try { audioCtx = new AudioContext(); } catch (e) { return; }
      }
      const run = () => {
        if (token !== cueToken || !settling || !audioCtx || audioCtx.state !== 'running') return;
        scheduleChime(audioCtx, audioCtx.currentTime);
      };
      if (audioCtx.state === 'running') run();
      else audioCtx.resume().then(run).catch(() => {});
    }

    function cueIsAudible() {
      return !chimeAudio.paused && chimeAudio.currentTime > 0.05 && chimeAudio.volume > 0.2;
    }

    function playChime() {
      prepareChime();
      const token = ++cueToken;
      if (audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed') audioCtx.resume().catch(() => {});
      chimeAudio.muted = false;
      chimeAudio.volume = 1;
      try { chimeAudio.currentTime = 0; } catch (e) {}
      const fallback = () => {
        if (token !== cueToken || !settling || cueIsAudible()) return;
        try { chimeAudio.pause(); } catch (e) {}
        playChimeWebAudio(token);
      };
      const pending = chimeAudio.play();
      if (pending && pending.catch) pending.catch(() => fallback());
      window.setTimeout(fallback, 320);
    }

    function stopCue() {
      cueToken += 1;
      if (cueGain && audioCtx) {
        try {
          const now = audioCtx.currentTime;
          cueGain.gain.cancelScheduledValues(now);
          cueGain.gain.setValueAtTime(0, now);
        } catch (e) {}
      }
      cueGain = null;
      try {
        chimeAudio.pause();
        chimeAudio.currentTime = 0;
      } catch (e) {}
    }

    function renderSettle(now) {
      const sec = Math.max(1, Math.ceil((settleUntil - now) / 1000));
      if (settleShown === sec) return;
      settleShown = sec;
      settleCount.textContent = String(sec);
      settleCount.classList.remove('tick');
      void settleCount.offsetWidth;
      settleCount.classList.add('tick');
      settleBars.forEach((bar, index) => bar.classList.toggle('down', index >= sec));
    }

    function beginSettle(now) {
      settling = true;
      settleUntil = now + SETTLE_MS;
      settleShown = 0;
      settlePanel.hidden = false;
      renderSettle(now);
      if (chimeOn) playChime();
    }

    function endSettleScreen() {
      const stopSound = settling;
      settling = false;
      settleUntil = 0;
      settleShown = 0;
      settlePanel.hidden = true;
      if (stopSound) stopCue();
      overMs = 0;
      quietSince = 0;
      phase = 'ok';
    }

    function finishSettle(now) {
      endSettleScreen();
      pendingThanks = true;
      thanksUntil = now + THANKS_MS;
      resumeListenAt = now + LISTEN_GAP_MS;
    }

    function cancelSettle() {
      if (!settling) return;
      endSettleScreen();
      pendingThanks = false;
      resumeListenAt = 0;
    }

    function frame(now) {
      if (!running) return;
      if (settling) {
        if (now >= settleUntil) finishSettle(now);
        else renderSettle(now);
      }
      if (settling || now < resumeListenAt) {
        rafId = requestAnimationFrame(frame);
        return;
      }
      const raw = Math.max(0, readRms() - NOISE_FLOOR) * sensitivity;
      recent.push({ t: now, v: raw });
      while (recent.length && now - recent[0].t > 700) recent.shift();
      if (raw > smoothed) smoothed += (raw - smoothed) * 0.42;
      else smoothed += (raw - smoothed) * 0.14;
      haveLevel = true;
      history.push({ t: now, v: smoothed });
      while (history.length && now - history[0].t > HISTORY_MS) history.shift();
      standardNowBtn.disabled = !haveLevel;
      const ratio = threshold > 0 ? smoothed / threshold : 0;
      const delta = lastFrameAt ? Math.min(80, now - lastFrameAt) : 16;
      lastFrameAt = now;

      if (paused) {
        if (!running) return;
        paint(ratio, 'paused', '暫停中');
        if (waveOpen) drawWave();
        rafId = requestAnimationFrame(frame);
        return;
      }

      if (ratio >= 1) quietSince = 0;
      else if (!quietSince) quietSince = now;
      const quietFor = quietSince ? now - quietSince : 0;
      const quietReset = quietResetMs();
      if (quietFor >= quietReset) overMs = 0;
      else if (ratio >= 1 && phase !== 'over') overMs += delta;

      let next = 'ok';
      if (overMs >= holdMs || (phase === 'over' && quietFor < quietReset)) next = 'over';
      else if (ratio >= NEAR_RATIO || overMs > 0) next = 'near';

      if (phase !== 'over' && next === 'over') {
        overCount += 1;
        renderCount();
        beginSettle(now);
      }
      if (!settling && phase === 'over' && next !== 'over') {
        pendingThanks = true;
        thanksUntil = now + THANKS_MS;
      }
      if (next === 'over') pendingThanks = false;
      if (settling) {
        phase = 'over';
        rafId = requestAnimationFrame(frame);
        return;
      }

      phase = next;
      let sentence = '維持這個音量';
      let tone = 'ok';
      if (next === 'over') {
        sentence = '請回到我們的約定';
        tone = 'over';
      } else if (next === 'near') {
        sentence = '我們可以再輕一點';
        tone = 'near';
      } else if (pendingThanks && now < thanksUntil) {
        sentence = '謝謝，回到約定了';
        tone = 'ok';
      } else {
        pendingThanks = false;
      }
      if (!running) return;
      paint(ratio, tone, sentence);
      if (waveOpen) drawWave();
      rafId = requestAnimationFrame(frame);
    }

    function ampOffset(amp, height) {
      const usable = height / 2 - 16;
      return Math.max(0, Math.min(usable, (amp / AMP_MAX) * usable));
    }

    function drawWave() {
      const rect = waveCanvas.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const pxW = Math.floor(w * dpr);
      const pxH = Math.floor(h * dpr);
      if (waveCanvas.width !== pxW || waveCanvas.height !== pxH) {
        waveCanvas.width = pxW;
        waveCanvas.height = pxH;
      }
      const ctx = waveCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, w, h);
      const mid = h / 2;
      const now = history.length ? history[history.length - 1].t : 0;
      const shade = w * (holdMs / HISTORY_MS);
      ctx.fillStyle = 'rgba(253, 230, 138, .12)';
      ctx.fillRect(w - shade, 0, shade, h);
      ctx.strokeStyle = 'rgba(255,255,255,.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, mid);
      ctx.lineTo(w, mid);
      ctx.stroke();

      if (timeBuf && timeBuf.length) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(148, 163, 184, .55)';
        ctx.lineWidth = 1.25;
        const step = timeBuf.length / w;
        for (let x = 0; x < w; x++) {
          const i = Math.min(timeBuf.length - 1, Math.floor(x * step));
          const sample = Math.abs((timeBuf[i] - 128) / 128) * sensitivity;
          const y = mid - ampOffset(sample, h);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      history.forEach((pt) => {
        const x = w * ((pt.t - (now - HISTORY_MS)) / HISTORY_MS);
        const amp = ampOffset(pt.v, h);
        ctx.fillStyle = pt.v >= threshold ? 'rgba(251, 113, 133, .9)' : 'rgba(248, 250, 252, .88)';
        ctx.fillRect(x, mid - amp, 3, Math.max(2, amp * 2));
      });

      const yLine = mid - ampOffset(threshold, h);
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, yLine);
      ctx.lineTo(w, yLine);
      ctx.moveTo(0, mid + (mid - yLine));
      ctx.lineTo(w, mid + (mid - yLine));
      ctx.stroke();
      const label = '連續 ' + formatSeconds(holdMs);
      ctx.font = '700 15px sans-serif';
      const tw = ctx.measureText(label).width;
      const lx = Math.max(8, w - Math.max(shade, tw + 20) + 8);
      ctx.fillStyle = 'rgba(2, 6, 23, .78)';
      ctx.fillRect(lx - 6, 8, tw + 12, 24);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(label, lx, 25);
      const tagTop = Math.max(14, Math.min(h - 14, yLine));
      lineTag.style.top = tagTop + 'px';
    }

    function thresholdFromClientY(clientY) {
      const rect = waveCanvas.getBoundingClientRect();
      const y = clientY - rect.top;
      const mid = rect.height / 2;
      const usable = rect.height / 2 - 16;
      const dist = Math.min(usable, Math.max(0, Math.abs(y - mid)));
      const amp = usable <= 0 ? 0.02 : (dist / usable) * AMP_MAX;
      return Math.max(0.02, Math.min(0.9, amp));
    }

    function applyThreshold(value, kind) {
      threshold = value;
      customKind = kind;
      overMs = 0;
      quietSince = 0;
      renderSceneUi();
    }

    function openWave() {
      if (!running) return;
      waveOpen = true;
      wavePanel.hidden = false;
      drawWave();
    }

    function closeWave() {
      waveOpen = false;
      wavePanel.hidden = true;
    }

    async function keepAwake() {
      if (!navigator.wakeLock) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    async function startMic() {
      if (opening || running) return;
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showMicMessage(window.isSecureContext ? 'unsupported' : 'insecure');
        return;
      }
      opening = true;
      startBtn.disabled = true;
      startBtn.textContent = '正在開啟麥克風…';
      unlockChime();
      setAudioRoute('auto');
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        await audioCtx.resume();
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: { ideal: false },
            noiseSuppression: { ideal: false },
            autoGainControl: { ideal: false }
          }
        });
        setAudioRoute('play-and-record');
        const track = stream.getAudioTracks()[0];
        if (track) track.addEventListener('ended', () => { if (running) showMicMessage('unreadable'); });
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0;
        source.connect(analyser);
        timeBuf = new Uint8Array(analyser.fftSize);
        smoothed = 0;
        haveLevel = false;
        overMs = 0;
        quietSince = 0;
        lastFrameAt = 0;
        phase = 'ok';
        thanksUntil = 0;
        pendingThanks = false;
        resumeListenAt = 0;
        endSettleScreen();
        paused = false;
        renderPause();
        overCount = 0;
        history = [];
        running = true;
        showPanel('live');
        renderSceneUi();
        paint(0, 'ok', '維持這個音量');
        await keepAwake();
        rafId = requestAnimationFrame(frame);
      } catch (err) {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        showMicMessage(classifyMicError(err));
      } finally {
        opening = false;
        startBtn.disabled = false;
        startBtn.textContent = '開始一起看音量';
      }
    }

    function setStandardToNow() {
      if (!haveLevel) return;
      let peak = smoothed;
      recent.forEach((sample) => { if (sample.v > peak) peak = sample.v; });
      applyThreshold(Math.max(peak, 0.02), 'now');
      saveSettings();
    }

    function renderPause() {
      const label = paused ? '繼續' : '暫停';
      pauseBtn.classList.toggle('is-paused', paused);
      pauseBtn.setAttribute('aria-label', label);
      pauseLabel.textContent = label;
      wavePauseBtn.textContent = label;
    }

    function togglePause() {
      if (settling) cancelSettle();
      paused = !paused;
      overMs = 0;
      quietSince = 0;
      renderPause();
      if (paused) paint(threshold > 0 ? smoothed / threshold : 0, 'paused', '暫停中');
    }

    document.addEventListener('visibilitychange', () => {
      if (!running || document.visibilityState !== 'visible') return;
      const track = stream && stream.getAudioTracks()[0];
      if (!track || track.readyState === 'ended') {
        showMicMessage('unreadable');
        return;
      }
      keepAwake();
      resumeAudio();
    });

    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener('devicechange', () => {
        if (!running) return;
        const track = stream && stream.getAudioTracks()[0];
        if (!track || track.readyState === 'ended') showMicMessage('unreadable');
      });
    }

    loadSettings();
    buildChoices();
    buildHoldChoices();
    renderSceneUi();
    setupChime.addEventListener('click', () => { unlockChime(); setChime(!chimeOn); });
    liveChime.addEventListener('click', () => { unlockChime(); setChime(!chimeOn); });
    startBtn.addEventListener('click', startMic);
    retryBtn.addEventListener('click', startMic);
    pauseBtn.addEventListener('click', togglePause);
    wavePauseBtn.addEventListener('click', togglePause);
    document.getElementById('wave-open-btn').addEventListener('click', openWave);
    document.getElementById('wave-close').addEventListener('click', closeWave);
    standardNowBtn.addEventListener('click', setStandardToNow);
    document.getElementById('count-reset').addEventListener('click', resetOverCount);
    countClassBtn.addEventListener('click', () => {
      countOnClass = !countOnClass;
      saveSettings();
      renderSceneUi();
    });
    gainSlider.addEventListener('input', () => {
      const next = parseFloat(gainSlider.value);
      sensitivity = next >= GAIN_MIN && next <= GAIN_MAX ? next : GAIN_DEFAULT;
      saveSettings();
      renderSceneUi();
    });
    document.getElementById('hold-minus').addEventListener('click', () => setHold(holdMs - 100));
    document.getElementById('hold-plus').addEventListener('click', () => setHold(holdMs + 100));
    holdInput.addEventListener('change', () => {
      const seconds = parseFloat(holdInput.value);
      if (!Number.isFinite(seconds)) return;
      setHold(seconds * 1000);
    });
    waveCanvas.addEventListener('pointerdown', (event) => {
      draggingLine = true;
      waveCanvas.setPointerCapture(event.pointerId);
      applyThreshold(thresholdFromClientY(event.clientY), 'drag');
    });
    waveCanvas.addEventListener('pointermove', (event) => {
      if (!draggingLine) return;
      applyThreshold(thresholdFromClientY(event.clientY), 'drag');
    });
    function endDrag() {
      if (!draggingLine) return;
      draggingLine = false;
      saveSettings();
    }
    waveCanvas.addEventListener('pointerup', endDrag);
    waveCanvas.addEventListener('pointercancel', endDrag);
    waveCanvas.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      event.preventDefault();
      const step = event.key === 'ArrowUp' ? 0.02 : -0.02;
      applyThreshold(Math.max(0.02, Math.min(0.9, threshold + step)), 'drag');
      saveSettings();
    });
  </script>
</body>
</html>
